<style>
/* Layout: one-column game HUD on a navy night ground; sticky HUD + crumb bar, then the current level's cards. */
:root {
  --bg: #151b26;
  --panel: #0f131b;
  --panel-2: #1b2331;
  --line: #2c3647;
  --fg: #eaf0f8;
  --muted: #98a3b6;
  --navy: #1E3A5F;
  --navy-2: #2c5384;
  --navy-hi: #8fb6ea;
  --yellow: #f6c51b;
  --yellow-ink: #1a1405;
  --teal: #2b6b78;
  --teal-line: #4fb3b0;
  --plum: #3f3d67;
  --plum-line: #8a7fd0;
  --good: #46cf8e;
  --risk: #f09140;
  --bad: #ef6f6f;
  --font: "Kanit", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 400; font-size: 16px; line-height: 1.55; }
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--navy-hi); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 920px; margin: 0 auto; padding-bottom: 48px; }
.app.phone { max-width: 460px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { background: var(--bg); border-bottom: 1px solid var(--line); display: grid; gap: 12px; padding-block: 14px; }
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.ava { position: relative; width: 64px; height: 64px; border-radius: 18px; background: var(--panel); display: grid; place-items: center; }
.ava .lv { position: absolute; right: -10px; bottom: -8px; background: var(--navy); border: 2px solid var(--navy-2); color: var(--fg); font-weight: 600; font-size: 13px; padding: 0 7px; border-radius: 999px; }
.hud h1 { margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--navy-hi); line-height: 1.25; }
.xp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-weight: 500; font-size: .92rem; }
.xp .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.xp .bar i { display: block; height: 100%; background: var(--navy-2); transition: width .5s; }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe17a, #d9a40d); vertical-align: -2px; margin-left: 2px; }
.tag { color: var(--muted); font-size: .78rem; letter-spacing: .06em; font-weight: 500; }
.btn { border: 0; border-radius: var(--r-md); padding: 12px 18px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.navy { background: var(--navy); color: var(--fg); border: 1px solid var(--navy-2); }
.btn.yellow { background: var(--yellow); color: var(--yellow-ink); }
.btn.black { background: #07090d; color: var(--fg); border: 1px solid #07090d; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.filebar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
.filebtn { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--navy); border: 1px solid var(--navy-2); border-radius: var(--r-md); padding: 12px 18px; cursor: pointer; font-weight: 600; font-size: 1.05rem; min-width: 0; }
.filebtn small { font-size: .78rem; font-weight: 500; background: rgba(255,255,255,.08); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.hidden-input { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.crumbs { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.crumbs::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--navy); border-color: var(--navy-2); }
.chip.sq { border-radius: 14px; width: 46px; padding: 6px 0; }
.crumbs .sep { color: var(--muted); flex: none; }
.search { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 10px 16px; }
.search input { background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; }
.search input::placeholder { color: var(--muted); }

/* Main */
main { display: grid; gap: 18px; padding-block: 20px; }
.hero { background: linear-gradient(160deg, var(--navy-2), var(--navy) 70%); border-radius: var(--r-lg); padding: 26px; display: grid; gap: 18px; position: relative; }
.hero .eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .14em; color: #c9d7ec; text-transform: uppercase; max-width: calc(100% - 80px); }
.hero h2 { margin: 0; font-size: clamp(1.9rem, 6vw, 2.5rem); font-weight: 700; line-height: 1.1; }
.hero p { margin: 0; color: #cfdaea; }
.hero .badge { position: absolute; top: 22px; right: 22px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { border-radius: var(--r-md); padding: 16px 12px; display: grid; gap: 2px; justify-items: center; text-align: center; border: 1.5px solid rgba(255,255,255,.06); background: rgba(10,16,28,.35); }
.tile .k { font-size: .85rem; color: #c4cfdf; font-weight: 500; }
.tile .v { font-size: 2rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .s { font-size: .8rem; color: #c4cfdf; }
.tile.teal { background: var(--teal); border-color: var(--teal-line); }
.tile.plum { background: var(--plum); border-color: var(--plum-line); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.unit { display: grid; gap: 16px; }
.unit .who { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.unit .ring { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--panel-2); display: grid; place-items: center; background: var(--panel); }
.unit .name { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.unit .name b { font-size: 1.35rem; font-weight: 600; color: var(--navy-hi); }
.unit .sub { color: var(--muted); font-size: .92rem; }
.pill { font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--navy); border: 1px solid var(--navy-2); white-space: nowrap; }
.pill.good { background: transparent; color: var(--good); border-color: var(--good); }
.pill.ok { background: transparent; color: var(--navy-hi); border-color: var(--navy-hi); }
.pill.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.money { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.money div { border-radius: var(--r-sm); border: 1.5px solid var(--line); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.money .k { font-size: .76rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.money .v { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.money .risk { background: #2a2018; border-color: #4a3524; } .money .risk .v { color: var(--risk); }
.money .net { background: #142a22; border-color: #24473a; } .money .net .v { color: var(--good); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.vcard { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 16px; display: grid; gap: 10px; min-width: 0; position: relative; }
.vcard:hover { border-color: var(--navy-2); }
.vcard .t { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.vcard .t b { font-weight: 600; font-size: 1.05rem; }
.vcard .m { display: flex; justify-content: space-between; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; gap: 8px; }
.vcard .m b { color: var(--fg); font-weight: 500; }
.vcard .m b.risk { color: var(--risk); }
.gauge { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; display: flex; }
.gauge i { display: block; height: 100%; }
.stamp { position: absolute; right: 12px; bottom: 12px; color: var(--good); border: 2px solid var(--good); border-radius: 8px; padding: 0 8px; font-size: .78rem; font-weight: 600; transform: rotate(-8deg); }
.how { display: grid; gap: 8px; color: #cfd8e6; font-size: .95rem; }
.how p { margin: 0; }
.how b { color: var(--fg); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; }
@media (max-width: 720px) { .exam { grid-template-columns: minmax(0, 1fr); } }
dl.kv { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meter { display: grid; gap: 4px; }
.meter .h { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.meter .h b { font-variant-numeric: tabular-nums; font-weight: 500; }
.dx { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.rx { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: rx; }
.rx li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.rx li::before { counter-increment: rx; content: counter(rx); width: 28px; height: 28px; border-radius: 50%; background: var(--navy); border: 1px solid var(--navy-2); display: grid; place-items: center; font-size: .85rem; font-weight: 600; }
.copy { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy .ph { font-variant-numeric: tabular-nums; user-select: all; background: var(--panel-2); border-radius: 8px; padding: 4px 10px; }
.empty { color: var(--muted); text-align: center; padding: 24px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--yellow); color: var(--yellow-ink); font-weight: 600; border-radius: 999px; padding: 10px 20px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }
.note { color: var(--muted); font-size: .85rem; }
@media (max-width: 560px) {
  .hud { gap: 10px; }
  .hud .add { padding: 8px 12px; font-size: .9rem; border-radius: 14px; }
  .hud h1 { font-size: 1.1rem; }
  .xp .bar { width: 70px; }
  .ava { width: 56px; height: 56px; }
  .tiles { gap: 8px; } .tile .v { font-size: 1.6rem; }
  .money { grid-template-columns: minmax(0, 1fr); }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .stamp.new { animation: stamp .35s ease-out; }
  @keyframes stamp { from { transform: rotate(-8deg) scale(2); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function doctor(size) {

  // ---------- data ----------
  const num = (v) => { if (typeof v === 'number') return v; const x = parseFloat(String(v == null ? '' : v).replace(/[,\s฿]/g, '')); return Number.isFinite(x) ? x : 0; };
  const txt = (v) => String(v == null ? '' : v).trim();
  function finish(r) {
    r.risk = r.pamt + r.damt;
    r.net = r.loaned + r.deposit;            // หมุนเวียน = บัญชี + ลูกหนี้
    r.sutthi = r.net - r.risk;               // สุทธิ = บัญชี + ลูกหนี้ − เสี่ยง
    r.status = Math.abs(r.net - STD) < 0.005 ? 'พอดี' : r.net > STD ? 'ดีเยี่ยม' : 'ป่วย·ขาด';
    r.key = [r.prov, r.amp, r.tam, r.moo, r.village].join('|');
    return r;
  }
  function seedRows() {
    return $('seed').textContent.trim().split('\n').map((l) => {
      const f = l.split('|');
      return finish({ prov: 'หนองบัวลำภู', amp: 'โนนสัง', tam: f[1], moo: f[2], village: f[3], chair: f[4], phone: f[5], level: f[6], fund: num(f[7]), hh: num(f[8]), loaned: num(f[9]), deposit: num(f[10]),
        phh: num(f[11]), pamt: num(f[12]), pcause: f[13], paction: f[14], dhh: 0, damt: 0, dcause: '', daction: '', group: f[15], savers: num(f[16]), savings: num(f[17]) });
    });
  }
  function rowsFromGrid(grid) {
    const out = [];
    for (const c of grid) {
      if (!c || !/^\d+$/.test(txt(c[0])) || !txt(c[1]) || !txt(c[5])) continue;
      let phone = txt(c[7]); if (/^\d{9}$/.test(phone)) phone = '0' + phone;
      out.push(finish({ prov: txt(c[1]).replace(/^จ(ังหวัด|\.)\s*/, ''), amp: txt(c[2]).replace(/^อ(ำเภอ|\.)\s*/, ''), tam: txt(c[3]).replace(/^ต(ำบล|\.)\s*/, ''), moo: txt(c[4]),
        village: txt(c[5]).replace(/^บ้าน\s+/, 'บ้าน'), chair: txt(c[6]), phone, level: txt(c[8]).replace('ระดับ', '').trim(),
        fund: num(c[9]), hh: num(c[10]), loaned: num(c[11]), deposit: num(c[12]),
        phh: num(c[22]), pamt: num(c[23]), pcause: txt(c[24]), paction: txt(c[25]), dhh: num(c[26]), damt: num(c[27]), dcause: txt(c[28]), daction: txt(c[29]),
        group: txt(c[30]), savers: num(c[31]), savings: num(c[32]) }));
    }
    return out;
  }
  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

          meter('ลูกหนี้ (ครัวเรือนยืม)', fmt(r.loaned) + ' ฿', r.net ? r.loaned / r.net * 100 : 0, 'var(--navy-hi)'),
          meter('บัญชี (ฝากธนาคาร)', fmt(r.deposit) + ' ฿', r.net ? r.deposit / r.net * 100 : 0, 'var(--yellow)'),
          meter('เสี่ยง (มีปัญหา + เสียหาย)', fmt(r.risk) + ' ฿', r.net ? r.risk / r.net * 100 : 0, 'var(--risk)')),
        h('div', { class: 'panel' }, h('h3', null, '🩺 ผลวินิจฉัย'), h('ul', { class: 'dx' }, dx.map((d) => h('li', null, d)))),
        h('div', { class: 'panel' }, h('h3', null, '💊 ใบสั่งการรักษา'), h('ol', { class: 'rx' }, rx.map((d) => h('li', null, d))),
          h('div', { class: 'row2' },
            h('button', { class: 'btn yellow', type: 'button', disabled: done, onclick: () => { seen.add(r.key); const sick = r.status === 'ป่วย·ขาด'; award(sick ? 80 : 40, sick ? 100 : 50, sick ? 'รักษาเคสหนักสำเร็จ' : 'บันทึกการตรวจแล้ว'); c.justDone = true; render(); } }, done ? '✓ ตรวจแล้ว' : '✓ บันทึกการตรวจ'),
            h('button', { class: 'btn navy', type: 'button', disabled: !nx, onclick: () => { if (!done) { seen.add(r.key); award(r.status === 'ป่วย·ขาด' ? 80 : 40, r.status === 'ป่วย·ขาด' ? 100 : 50, 'บันทึกการตรวจแล้ว'); } stack[stack.length - 1] = { v: 'vil', p: r.prov, a: r.amp, t: r.tam, r: nx }; render(); window.scrollTo({ top: 0 }); } }, nx ? 'คนไข้ถัดไป: ' + nx.village + ' ›' : 'ตรวจครบทั้งวอร์ด')))))];
  }

  function render() {
    const c = cur();
    crumbs(); hud();
    const views = { home: viewHome, provs: viewProvs, prov: viewProv, amp: viewAmp, tam: viewTam, vil: viewVil, list: viewList };
    $('main').replaceChildren(...[].concat(views[c.v](c)));
    c.justDone = false;
  }

  // ---------- import ----------
  function readFile(file, merge) {
    const name = file.name || 'ไฟล์';
    const done = (rows) => {
      if (!rows.length) { toast('ไม่พบแถวข้อมูลหมู่บ้าน ตรวจว่าเป็นไฟล์ (กข.คจ.) แยกตามจังหวัด'); return; }
      if (merge) {
        const areas = new Set(rows.map((r) => r.prov + '|' + r.amp));
        DATA = DATA.filter((r) => !areas.has(r.prov + '|' + r.amp)).concat(rows);
        SOURCE = 'ชีตหลายไฟล์ล่าสุด ' + name;
      } else { DATA = rows; SOURCE = 'ไฟล์ ' + name; }
      store.set(KEY_DATA, { rows: DATA, source: SOURCE });
      stack = [{ v: 'home' }];
      award(20, 0, 'นำเข้า ' + rows.length + ' หมู่บ้านจาก ' + name);
      render();
    };
    const isCSV = /\.csv$/i.test(name) || file.type === 'text/csv';
    const fr = new FileReader();
    fr.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ ลองเลือกไฟล์ใหม่');
    if (isCSV) {
      fr.onload = () => { try { done(rowsFromGrid(parseCSV(String(fr.result).replace(/^﻿/, '')))); } catch (e) { toast('อ่าน CSV ไม่ได้: ' + e.message); } };
      fr.readAsText(file, 'utf-8');
    } else {
      if (!window.XLSX) { toast('โหลดตัวอ่าน Excel ไม่ได้ ให้บันทึกไฟล์เป็น CSV UTF-8 แล้วนำเข้าใหม่'); return; }
      fr.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' });
          let rows = [];
          wb.SheetNames.forEach((sn) => { rows = rows.concat(rowsFromGrid(XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }))); });
          done(rows);
        } catch (e) { toast('อ่าน Excel ไม่ได้ ให้บันทึกเป็น CSV UTF-8 แล้วนำเข้าใหม่'); }
      };
      fr.readAsArrayBuffer(file);
    }
  }
  function resetData() { DATA = seedRows(); SOURCE = 'ข้อมูลชีต ปีงบ 2569'; try { localStorage.removeItem(KEY_DATA); } catch (e) {} stack = [{ v: 'home' }]; render(); toast('กลับไปใช้ข้อมูลชีตเดิมแล้ว'); }
  $('fileInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) readFile(f, false); e.target.value = ''; });
  $('addInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) readFile(f, true); e.target.value = ''; });

  // ---------- misc ----------
  function applyPhone() { $('app').classList.toggle('phone', !!ui.phone); $('phoneBtn').setAttribute('aria-pressed', String(!!ui.phone)); $('phoneBtn').textContent = ui.phone ? '🖥️ จอใหญ่' : '📱 มือถือ'; }
  $('phoneBtn').addEventListener('click', () => { ui.phone = !ui.phone; store.set(KEY_UI, ui); applyPhone(); });
  let qt; $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(render, 150); });
  applyPhone();
  render();
})();
</script>
