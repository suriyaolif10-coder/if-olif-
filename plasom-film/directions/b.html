<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
.f{background:radial-gradient(900px 1200px at 50% 60%,#4a5d2e,#1c2412 75%);perspective:1600px}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.b1{left:-120px;top:420px;width:760px;height:400px;transform:rotateY(38deg) translateZ(-300px);filter:brightness(.7)}
.b2{left:470px;top:300px;width:760px;height:400px;transform:rotateY(-38deg) translateZ(-420px);filter:brightness(.6)}

<div class="card hero"><img src="../assets/plate.png"></div>
</div>
<div class="t">ปลาส้มสายเดี่ยว<small>สมุนไพร</small></div>
<img class="logo" src="../assets/logo.png">
</div></body></html>
