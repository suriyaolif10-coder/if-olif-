<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หมึกกระตอยตัวจิ๋ว</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF8E8; --ink:#1B1B1B;
    --orange:#FF7A45; --yellow:#FFD93D; --blue:#5B8DEF; --green:#7ED6A0;
    --skin:#F6C9A2; --hair:#4A2C1A;
  }
  html,body{margin:0;height:100%;}
  body{
    background:#2A2420;
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  /* wrapper takes the scaled size so the page never scrolls sideways */
  #fit{position:relative;}
  #stage{
    position:absolute;top:0;left:0;
    transform-origin:top left;
    background:
      radial-gradient(120% 80% at 20% 10%, #FFFDF5 0%, transparent 60%),
      radial-gradient(90% 70% at 90% 100%, #F3E4C4 0%, transparent 65%),
      var(--paper);
  }
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;}

  .sticker{position:absolute;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.18));transition:transform .35s cubic-bezier(.3,1.6,.5,1);}
  .sticker.focus{animation:wiggle .6s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(var(--r)) scale(1.18)}50%{transform:rotate(calc(var(--r) + 8deg)) scale(1.24)}}
  .sticker{transform:rotate(var(--r));}
  .float{animation:float 3.2s ease-in-out infinite;}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}

  /* character poses */
  #girl .arm{transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.5,.5,1);}
  #girl #armR{transform-origin:138px 168px;}
  #girl #armL{transform-origin:62px 168px;}
  #girl.point #armR{transform:rotate(-118deg);}
  #girl.point #armL{transform:rotate(8deg);}
  #girl.explain #armR{transform:rotate(-62deg);}
  #girl.explain #armL{transform:rotate(62deg);}
  #girl.cheer #armR{transform:rotate(-150deg);}
  #girl.cheer #armL{transform:rotate(150deg);}
  #girl #head{transform-box:view-box;transform-origin:100px 150px;animation:nod 1.6s ease-in-out infinite;}
  @keyframes nod{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
  #mouth{transform-box:fill-box;transform-origin:center;}
  .talking #mouth{animation:talk .22s steps(2) infinite;}
  @keyframes talk{0%{transform:scaleY(1)}100%{transform:scaleY(.35)}}

  /* subtitles */
  #sub{
    font-size:25px;font-weight:700;line-height:1.35;text-align:center;
    background:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:8px 16px;box-shadow:4px 5px 0 var(--ink);
    white-space:nowrap;
  }
  .pop-in{animation:pop .32s cubic-bezier(.2,1.8,.4,1) both;}
  @keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}70%{opacity:1}100%{transform:scale(1) rotate(var(--sr,0deg));opacity:1}}
  .hl{
    display:inline-block;padding:0 8px;margin:0 2px;
    border:2px solid var(--ink);border-radius:8px;
    box-shadow:2px 3px 0 var(--ink);
    animation:stamp .38s .12s cubic-bezier(.2,1.8,.4,1) both;
  }
  @keyframes stamp{0%{transform:scale(1.5) rotate(0deg)}100%{transform:scale(1) rotate(var(--hr,1deg))}}

  #trick{transition:background .3s;}
  #trick.swap{animation:pop .4s cubic-bezier(.2,1.8,.4,1) both;}

  #overlay{transition:opacity .25s;}
  #overlay.hide{opacity:0;pointer-events:none;}
  .btn{border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transition:transform .1s, box-shadow .1s;}
  .btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink);}
  .btn:focus-visible{outline:3px dashed var(--blue);outline-offset:4px;}

  @media (prefers-reduced-motion: reduce){
    .float,#girl #head,.sticker.focus{animation:none!important;}
  }
</style>
</head>

<script>
const C = { orange:"#FF7A45", yellow:"#FFD93D", blue:"#5B8DEF", green:"#7ED6A0" };

// TRICK 01: every chunk ≤ 5 words, 0.6–1.2s.  TRICK 02: highlight words with the 4-color palette.
const timeline = [
  { text:"รู้จักไหม?", duration:700, pose:"point" },
  { text:"หมึกกระตอย", highlight:{word:"หมึกกระตอย", color:C.yellow}, duration:1000, pose:"cheer", focus:"squid" },
  { text:"ตัวจิ๋วแค่ 3 ซม.", highlight:{word:"3 ซม.", color:C.orange}, duration:1000, pose:"point", focus:"tag" },
  { text:"ตัวกลมป๊อก", highlight:{word:"กลมป๊อก", color:C.yellow}, duration:800, pose:"explain", focus:"squid" },
  { text:"ครีบเหมือนหูเล็กๆ", highlight:{word:"ครีบ", color:C.yellow}, duration:900, pose:"explain", focus:"squid" },
  { text:"ความลับข้อแรก", highlight:{word:"ข้อแรก", color:C.yellow}, duration:800, pose:"point", trick:"ความลับ 01", trickColor:C.yellow },
  { text:"กลางวันมุดทราย", highlight:{word:"มุดทราย", color:C.yellow}, duration:900, pose:"explain", focus:"sand" },
  { text:"ซ่อนตัวจากศัตรู", highlight:{word:"ซ่อนตัว", color:C.blue}, duration:900, pose:"point", focus:"sand" },
  { text:"กลางคืนค่อยออกล่า", highlight:{word:"ออกล่า", color:C.green}, duration:1000, pose:"cheer", focus:"moon" },
  { text:"ความลับข้อสอง", highlight:{word:"ข้อสอง", color:C.yellow}, duration:800, pose:"point", trick:"ความลับ 02", trickColor:C.blue },
  { text:"มันเรืองแสงได้", highlight:{word:"เรืองแสง", color:C.yellow}, duration:900, pose:"cheer", focus:"moon" },
  { text:"เพราะมีแบคทีเรีย", highlight:{word:"แบคทีเรีย", color:C.yellow}, duration:1000, pose:"explain", focus:"squid" },
  { text:"อยู่ในอวัยวะแสง", duration:900, pose:"explain", focus:"squid" },
  { text:"ส่องแสงลงด้านล่าง", duration:900, pose:"point", focus:"moon" },
  { text:"กลืนกับแสงจันทร์", highlight:{word:"แสงจันทร์", color:C.blue}, duration:1000, pose:"explain", focus:"moon" },
  { text:"ศัตรูมองไม่เห็นเงา", highlight:{word:"มองไม่เห็น", color:C.blue}, duration:1100, pose:"cheer" },
  { text:"ส่วนสายกิน", highlight:{word:"สายกิน", color:C.yellow}, duration:800, pose:"point", trick:"เมนูเด็ด", trickColor:C.orange },
  { text:"ย่างจิ้มซีฟู้ด", highlight:{word:"ย่าง", color:C.yellow}, duration:900, pose:"explain", focus:"phone" },
  { text:"หรือทอดกระเทียม", highlight:{word:"ทอดกระเทียม", color:C.yellow}, duration:1000, pose:"explain", focus:"phone" },
  { text:"ตัวเล็กเคี้ยวง่าย", highlight:{word:"เคี้ยวง่าย", color:C.blue}, duration:900, pose:"cheer" },
  { text:"ชอบแบบไหน?", duration:700, pose:"point" },
  { text:"คอมเมนต์บอกหน่อย", highlight:{word:"คอมเมนต์", color:C.green}, duration:1000, pose:"explain", focus:"phone" },
  { text:"แล้วกดเซฟไว้เลย", highlight:{word:"เซฟ", color:C.green}, duration:1200, pose:"cheer", focus:"phone", trick:"SAVE!", trickColor:C.green },
];
const TOTAL = timeline.reduce((s,c)=>s+c.duration,0);

const $ = id => document.getElementById(id);
const sub=$("sub"), girl=$("girl"), bar=$("bar"), timeEl=$("time"), trick=$("trick");
const overlay=$("overlay"), bigLabel=$("bigLabel"), ctrlIcon=$("ctrlIcon"), ctrl=$("ctrl");
const stickers=["moon","squid","sand","tag","phone"].map(n=>$("st-"+n));

const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function renderChunk(c){
  let html = esc(c.text);
  if (c.highlight){
    const w = esc(c.highlight.word), tilt = (Math.random()*3-1).toFixed(1); // -1..2deg
    html = html.replace(w, `<span class="hl" style="background:${c.highlight.color};--hr:${tilt}deg">${w}</span>`);
  }
  sub.innerHTML = html;
  sub.style.setProperty("--sr", (Math.random()*4-2).toFixed(1)+"deg");
  sub.classList.remove("pop-in"); void sub.offsetWidth; sub.classList.add("pop-in");
}

let idx=0, timer=null, playing=false, startAt=0, elapsedBefore=0, chunkLeft=0, chunkStart=0, raf=null;

function show(i){
  const c = timeline[i];
  renderChunk(c);
  girl.setAttribute("class", (c.pose||"explain")+" talking");
  stickers.forEach(s=>s.classList.toggle("focus", s.id==="st-"+c.focus));
  if (c.trick){
    trick.textContent=c.trick; trick.style.background=c.trickColor;
    trick.classList.remove("swap"); void trick.offsetWidth; trick.classList.add("swap");
  }
}
function schedule(ms){
  chunkStart=performance.now(); chunkLeft=ms;
  timer=setTimeout(()=>{
    idx++;
    if (idx>=timeline.length){ finish(); return; }
    show(idx); schedule(timeline[idx].duration);
  }, ms);
}
function tick(){
  const t = Math.min(TOTAL, elapsedBefore + (performance.now()-startAt));
  bar.style.width = (t/TOTAL*100)+"%";
  timeEl.textContent = (t/1000).toFixed(1)+"s";
  if (playing) raf=requestAnimationFrame(tick);
}
function setIcon(isPlaying){
  ctrlIcon.innerHTML = isPlaying
    ? '<rect x="3" y="2" width="4" height="14" fill="#1B1B1B"/><rect x="11" y="2" width="4" height="14" fill="#1B1B1B"/>'
    : '<path d="M4 2 L16 9 L4 16Z" fill="#1B1B1B"/>';
  ctrl.setAttribute("aria-label", isPlaying ? "หยุดชั่วคราว" : "เล่น");
}
function play(){
  overlay.classList.add("hide");
  playing=true; setIcon(true);
  startAt=performance.now();
  if (chunkLeft>0){ girl.classList.add("talking"); schedule(chunkLeft); }
  else { show(idx); schedule(timeline[idx].duration); }
  tick();
}
function pause(){
  playing=false; setIcon(false);
  clearTimeout(timer); cancelAnimationFrame(raf);
  elapsedBefore += performance.now()-startAt;
  chunkLeft = Math.max(0, chunkLeft - (performance.now()-chunkStart));
  girl.classList.remove("talking");
}
function reset(){
  clearTimeout(timer); cancelAnimationFrame(raf);
  idx=0; elapsedBefore=0; chunkLeft=0;
  trick.textContent="INTRO"; trick.style.background=C.yellow;
}
function finish(){
  playing=false; setIcon(false); cancelAnimationFrame(raf);
  elapsedBefore=TOTAL; tick();
  girl.setAttribute("class","cheer");
  stickers.forEach(s=>s.classList.remove("focus"));
  bigLabel.textContent="เล่นซ้ำ";
  overlay.classList.remove("hide");
  idx=timeline.length;
}
function toggle(){
  if (playing) pause();
  else { if (idx>=timeline.length) reset(); play(); }
}
$("big").addEventListener("click", ()=>{ reset(); play(); });
ctrl.addEventListener("click", toggle);
document.addEventListener("keydown", e=>{ if(e.code==="Space"){ e.preventDefault(); toggle(); }});

// scale the 390×844 stage to fit any screen without horizontal scroll
function fit(){
  const s = Math.min(window.innerWidth/390, window.innerHeight/844, 1.25);
  $("stage").style.transform = `scale(${s})`;
  $("fit").style.width = 390*s+"px"; $("fit").style.height = 844*s+"px";
}
window.addEventListener("resize", fit); fit();
show(0); girl.classList.remove("talking"); sub.classList.remove("pop-in");
</script>
</body>
</html>
