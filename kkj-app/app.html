const num = (v) => { if (typeof v === 'number') return Number.isFinite(v) ? v : 0; const s = String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''); const x = parseFloat(s); return Number.isFinite(x) ? x : 0; };

/* The one formula: รวมสุทธิ = บัญชี + ลูกหนี้ − เสี่ยง, เสี่ยง = มีปัญหา + เสียหาย */
function finish(v) {
  v.district = txt(v.district) || 'โนนสัง';
  v.province = txt(v.province) || 'หนองบัวลำภู';
  v.tambon = txt(v.tambon).replace(/^(ต\.|ตำบล)\s*/, '');
  v.moo = txt(v.moo).replace(/^(ม\.|หมู่ที่|หมู่)\s*/, '');
  v.name = normName(v.name);
  ['deposit', 'loaned', 'problem', 'damaged', 'fund', 'hh', 'problemHH', 'damagedHH', 'savers', 'savings'].forEach((k) => { v[k] = num(v[k]); });
  v.risk = Math.round((v.problem + v.damaged) * 100) / 100;
  v.circ = Math.round((v.deposit + v.loaned) * 100) / 100;
  v.net = Math.round((v.deposit + v.loaned - v.risk) * 100) / 100;
  v.gap = Math.round((STD - v.net) * 100) / 100;
  const s = statusOf(v.net); v.status = s.id; v.statusLabel = s.label;
  v.good = v.net >= STD - 0.004;
  const pc = POSTAL[v.district] || txt(v.postal);
  v.address = v.addressOverride || [v.name, 'หมู่ที่ ' + v.moo, 'ต.' + v.tambon, 'อ.' + v.district, 'จ.' + v.province, pc].filter(Boolean).join(' ');
  v.id = v.district + '-' + v.tambon + '-' + v.moo + '-' + v.name;
  return v;
}

function rowsFromHeaders(grid) {

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function parseGrid(grid) {
  const byHead = rowsFromHeaders(grid); if (byHead && byHead.length) return byHead; // simple CSV / native sheet
  return rowsFromGrid(grid) || [];
}
// The Drive connector returns the .xlsx as flattened text: rebuild rows from it
function rowsFromDriveText(text) {
  const start = text.indexOf('หมายเหตุ,');
  if (start < 0) return [];
  const body = text.slice(start + 'หมายเหตุ,'.length).trim();
  const chunks = body.split(/\s+(?=\d{1,4},[^,"\d][^,"]*,[^,"\d][^,"]*,[^,"\d][^,"]*,\d{1,3},)|\s+(?=รวมทั้งหมด,)/);
  const grid = [[], ['ลำดับที่', 'จังหวัด', 'อำเภอ'], []];
  chunks.forEach((ch) => { const r = parseCSV(ch.replace(/\n/g, ' ')); if (r[0]) grid.push(r[0]); });
  return rowsFromGrid(grid) || [];
}
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = XLSX_CDN; s.async = true;
    s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error('no XLSX')));
    s.onerror = () => { xlsxPromise = null; rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
async function readAnyFile(file) {
  const name = file.name || '';
  if (/\.csv$/i.test(name) || /csv|text\/plain/.test(file.type)) {
    const text = await file.text();
    return parseGrid(parseCSV(text));
  }
  let XLSX;
  try { XLSX = await loadXLSX(); } catch (e) { throw new Error('โหลดตัวอ่าน Excel ไม่ได้ ให้เปิดไฟล์ใน Excel แล้วบันทึกเป็น CSV UTF-8 แล้วนำเข้าใหม่'); }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const names = wb.SheetNames.slice().sort((a, b) => (b.includes('แยกตามจังหวัด') ? 1 : 0) - (a.includes('แยกตามจังหวัด') ? 1 : 0));
  for (const sn of names) {
    const rows = parseGrid(XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }));
    if (rows.length) return rows;
  }
  return [];
}

  if (c === 'blocked_by_policy') return 'องค์กรไม่อนุญาตให้ใช้ ' + server + ' ในแอปนี้';

      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'A2:I' + (n + 1), values: ai }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'L2:N' + (n + 1), values: ln }, { cache: false });
      if (n > have) { // new rows have no formula yet: write the computed numbers
        const jk = list.slice(have).map((v) => [v.net, v.gap]);
        await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'J' + (have + 2) + ':K' + (n + 1), values: jk }, { cache: false });
      }
      if (have > n) {
        const blank = Array.from({ length: have - n }, () => Array(14).fill(''));
        await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'A' + (n + 2) + ':N' + (have + 1), values: blank }, { cache: false });
      }
      setSync({ busy: false, msg: 'ส่งขึ้นชีตแล้ว ' + n + ' หมู่บ้าน (อ.โนนสัง)', err: '' });
      award(30, 10, 'ส่งข้อมูลขึ้นชีต');
    } catch (e) { setSync({ busy: false, msg: '', err: mcpMessage(e, SHEETS) + ' (ข้อมูลในชีตอาจถูกเขียนไปบางส่วน ให้กดดึงข้อมูลเพื่อตรวจ)' }); }
  }
  async function pushOne(v) {
    try {
      const cur = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: SHEET_ID, range: 'A1:N1000' }, { cache: false });
      const values = (cur.payload && cur.payload.values) || [];
      const idx = values.findIndex((r, i) => i > 0 && key(r[2]) === key(v.tambon) && key(r[1]) === key(v.moo) && key(r[3]) === key(v.name));
      if (idx < 0) return 'ไม่พบหมู่บ้านนี้ในชีต ใช้ปุ่ม "ส่งขึ้นชีตทั้งหมด" ในแท็บข้อมูล';
      const r = idx + 1;
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'G' + r + ':I' + r, values: [[v.deposit, v.loaned, v.risk]] }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'L' + r, values: [[v.statusLabel]] }, { cache: false });
      return 'อัปเดตแถว ' + r + ' ในชีตแล้ว';

  async function readOldXlsx() {

      const rows = rowsFromDriveText(text);
      if (!rows.length) throw new Error('อ่านแถวข้อมูลจากไฟล์ไม่ได้ รูปแบบไฟล์อาจเปลี่ยนไป');
      replaceVillages(rows, 'ไฟล์ Excel เดิมใน Drive');

  if (modal.type === 'list') {
    return html`<${Modal} title=${modal.title} sub=${modal.sub} onClose=${close}>
      ${modal.items.length ? modal.items.map((v) => html`<${VRow} key=${v.id} v=${v} checked=${!!ctx.game.checked[v.id]} onOpen=${ctx.openVillage} />`) : html`<p class="muted">ไม่มีหมู่บ้านในกลุ่มนี้</p>`}

    if (modal.stage === 'error') return html`<${Modal} title="นำเข้าไม่สำเร็จ" sub=${modal.name} onClose=${close} footer=${html`<button class="btn btn-gold flex-1" type="button" onClick=${() => { close(); ctx.pickFile(); }}>เลือกไฟล์ใหม่</button>`}><p style=${{ color: 'var(--bad)' }}>${modal.error}</p></${Modal}>`;
    const a = agg(modal.rows);
    return html`<${Modal} title=${'นำเข้าสำเร็จ ' + modal.rows.length + ' หมู่บ้าน'} sub=${modal.name + ' · อ.' + modal.districts.join(', อ.')} onClose=${close}
      footer=${html`<button class="btn btn-navy flex-1" type="button" onClick=${() => ctx.go({}, 'clinic')}>ไปหน้า อำเภอ ›</button>`}>
      <p class="small muted">เงินครบ ${a.good} · ป่วย ${a.sick} · ข้อมูลอำเภอเดิมที่ชื่อซ้ำถูกแทนที่ด้วยไฟล์นี้</p>
      <p class="small font-semibold">5 รายการแรก</p>
      ${modal.rows.slice(0, 5).map((v) => html`<div key=${v.id} class="card" style=${{ padding: 12 }}><div class="row"><b>${v.name}</b><${Status} v=${v} /></div><div class="muted small">${v.address}</div><div class="small num">${baht(v.deposit)} + ${baht(v.loaned)} − ${baht(v.risk)} = <b>${baht(v.net)}</b></div></div>`)}
    </${Modal}>`;
  }
  if (modal.type === 'confirmPush') {
    return html`<${Modal} title="ส่งขึ้น Google Sheets ทั้งหมด?" onClose=${close} footer=${html`<button class="btn btn-ghost flex-1" type="button" onClick=${close}>ยกเลิก</button><button class="btn btn-gold flex-1" type="button" onClick=${modal.run}>ยืนยัน เขียนทับ</button>`}>
      <p>แอปจะเขียนข้อมูล อ.โนนสัง ทุกหมู่บ้านทับคอลัมน์ A–I และ L–N ในชีต "คลินิกแก้หนี้ NBL 280K" สูตรในคอลัมน์ J–K ยังอยู่เหมือนเดิม</p>
      <p class="muted small">ถ้ามีคนแก้ชีตหลังจากที่ดึงข้อมูลล่าสุด การแก้นั้นจะถูกทับ แนะนำให้กด "ดึงจากชีต" ก่อน</p>
    </${Modal}>`;
  }
  if (modal.type === 'confirmReset') {
    return html`<${Modal} title=${modal.title} onClose=${close} footer=${html`<button class="btn btn-ghost flex-1" type="button" onClick=${close}>ยกเลิก</button><button class="btn btn-danger flex-1" type="button" onClick=${() => { modal.run(); close(); }}>ยืนยัน</button>`}><p>${modal.body}</p></${Modal}>`;
  }
  return null;
}

/* ================= clinic (drill-down) ================= */
function Crumbs({ path, go, villages }) {
  const v = path.id ? villages.find((x) => x.id === path.id) : null;
  const items = [{ l: 'อำเภอ', p: {} }];
  if (path.district) items.push({ l: 'อ.' + path.district, p: { district: path.district } });
  if (path.tambon) items.push({ l: 'ต.' + path.tambon, p: { district: path.district, tambon: path.tambon } });
  if (v) items.push({ l: v.name, p: path });
  return html`<nav class="crumbs" aria-label="ตำแหน่ง">
    ${items.length > 1 ? html`<button class="chip" type="button" aria-label="ย้อนกลับ" onClick=${() => go(items[items.length - 2].p)}>‹</button>` : null}
    ${items.map((it, i) => html`<${React.Fragment} key=${i}>${i ? html`<span class="muted" aria-hidden="true">›</span>` : null}<button class=${'chip' + (i === items.length - 1 ? ' on' : '')} type="button" aria-current=${i === items.length - 1 ? 'page' : null} onClick=${() => go(it.p)}>${it.l}</button></${React.Fragment}>`)}

  const next = ward[0];

  if (v.problem > 0) { dx.push('เงินมีปัญหา ' + baht(v.problem) + ' บาท' + (v.problemHH ? ' (' + v.problemHH + ' ครัวเรือน)' : '') + (v.problemCause ? ' สาเหตุ: ' + v.problemCause : '')); rx.push('ประชุมคณะกรรมการ ติดตามทวงถาม ทำหนังสือรับสภาพหนี้กับครัวเรือนที่ค้างชำระ'); if (v.problemAction) rx.push('ติดตามผลที่รายงานไว้: ' + v.problemAction); }
  if (v.damaged > 0) { dx.push('เงินเสียหาย ' + baht(v.damaged) + ' บาท' + (v.damagedCause ? ' สาเหตุ: ' + v.damagedCause : '')); rx.push('ตั้งคณะกรรมการตรวจสอบข้อเท็จจริง และรายงานอำเภอ'); }
  if (v.circ && v.deposit / v.circ >= 0.4) { dx.push('เงินค้างในบัญชี ' + Math.round(v.deposit / v.circ * 100) + '% ครัวเรือนยืมน้อย'); rx.push('ประชาสัมพันธ์ให้ครัวเรือนยากจนยื่นยืมเงินประกอบอาชีพตามระเบียบ'); }
  if (!dx.length) { dx.push('สุขภาพดี เงินครบตามมาตรฐาน 280,000'); rx.push('ติดตามตามรอบปกติ และยกเป็นหมู่บ้านตัวอย่าง'); }

  };
  const copy = (t, el) => { try { navigator.clipboard.writeText(t).then(() => say('คัดลอกแล้ว'), () => say('คัดลอกไม่ได้ กดค้างที่ตัวเลขเพื่อคัดลอก')); } catch (e) { say('คัดลอกไม่ได้ กดค้างที่ตัวเลขเพื่อคัดลอก'); } };

  return html`
    <section class="card grid gap-3">
      <div class="flex items-center gap-3"><${Logo} size=${64} /><div class="min-w-0"><div class="text-xl font-semibold" style=${{ color: 'var(--navy-hi)' }}>${v.name}</div><div class="muted small">${v.address}</div></div></div>

        <div><div class="muted">เบอร์โทร</div><div class="flex items-center gap-2"><span class="num" style=${{ userSelect: 'all' }}>${v.phone || '—'}</span>${v.phone ? html`<button class="chip" type="button" style=${{ padding: '1px 10px' }} onClick=${() => copy(v.phone)}>คัดลอก</button>` : null}</div></div>
        ${v.level ? html`<div><div class="muted">ระดับศักยภาพ</div><div>${v.level}</div></div>` : null}
        ${v.hh ? html`<div><div class="muted">ครัวเรือนที่ยืม</div><div class="num">${b0(v.hh)}</div></div>` : null}
      </div>
    </section>
    <section class="card grid gap-3">
      <div class="font-semibold">📟 จอสัญญาณชีพ</div>
      <div class="grid grid-cols-2 gap-2">
        <div class="money"><div class="k">เงินในบัญชี</div><div class="v">${baht(v.deposit)}</div></div>
        <div class="money"><div class="k">เงินลูกหนี้</div><div class="v">${baht(v.loaned)}</div></div>
        <div class="money risk"><div class="k">เงินเสี่ยง (มีปัญหา ${b0(v.problem)} + เสียหาย ${b0(v.damaged)})</div><div class="v">${baht(v.risk)}</div></div>
        <div class="money net"><div class="k">รวมสุทธิ</div><div class="v" style=${{ color: v.good ? 'var(--good)' : 'var(--bad)' }}>${baht(v.net)}</div></div>
      </div>
      <div class="small num muted">${baht(v.deposit)} + ${baht(v.loaned)} − ${baht(v.risk)} = <b style=${{ color: 'var(--fg)' }}>${baht(v.net)}</b> · ${v.gap > 0 ? 'ขาด ' + baht(v.gap) : 'เกิน ' + baht(-v.gap)} จาก 280,000</div>
      <div><div class="row small"><span>รวมสุทธิ เทียบ 280K</span><span class="num">${Math.round(v.net / STD * 100)}%</span></div><div class="gauge"><i style=${{ width: pct(v.net / STD * 100), background: v.good ? 'var(--good)' : 'var(--bad)' }}></i></div></div>
      ${edit ? html`<div class="grid grid-cols-2 gap-2">
          ${[['deposit', 'เงินในบัญชี'], ['loaned', 'เงินลูกหนี้'], ['problem', 'เงินมีปัญหา'], ['damaged', 'เงินเสียหาย']].map(([k, l]) => html`<div class="field" key=${k}><label for=${'f-' + k}>${l}</label><input id=${'f-' + k} inputmode="decimal" value=${form[k]} onInput=${(e) => setForm(Object.assign({}, form, { [k]: e.target.value }))} /></div>`)}
          <div class="small muted" style=${{ gridColumn: '1 / -1' }}>รวมสุทธิใหม่ = <b class="num" style=${{ color: 'var(--fg)' }}>${baht(num(form.deposit) + num(form.loaned) - num(form.problem) - num(form.damaged))}</b> บาท</div>
          <button class="btn btn-ghost" type="button" onClick=${() => setEdit(false)}>ยกเลิก</button><button class="btn btn-gold" type="button" onClick=${save}>บันทึก${mcpOk && v.district === 'โนนสัง' ? ' + ส่งขึ้นชีต' : ''}</button>
        </div>` : html`<button class="btn btn-ghost" type="button" onClick=${startEdit}>✏️ แก้ตัวเลขของหมู่บ้านนี้</button>`}
      ${pushMsg ? html`<div class="small" style=${{ color: pushing ? 'var(--muted)' : 'var(--ok)' }}>${pushMsg}</div>` : null}
    </section>
    <section class="card grid gap-2"><div class="font-semibold">🩺 ผลวินิจฉัย</div><ul class="grid gap-1 pl-5 list-disc">${dx.map((d, i) => html`<li key=${i}>${d}</li>`)}</ul></section>

      <div class="grid grid-cols-2 gap-2 mt-2">

      </div>
      ${next ? html`<div class="muted small">ถัดไป: ${next.name} (${next.statusLabel})</div>` : null}
    </section>`;
}

/* ================= patients ================= */
function Patients(ctx) {
  const { villages, openVillage, game } = ctx;
  const [q, setQ] = useState(''); const [f, setF] = useState('all'); const [d, setD] = useState('');
  const districts = districtsOf(villages);
  const base = villages.filter((v) => !d || v.district === d);
  const list = base.filter((v) => (f === 'all' || (f === 'good' ? v.good : f === 'sick' ? !v.good : v.status === f)) && (!q || (v.name + ' ' + v.tambon + ' ' + v.chair + ' ' + v.district).includes(q.trim()))).sort((a, b) => a.net - b.net);
  const a = agg(base);
  return html`<section class="grid gap-3">
    <div class="text-xl font-semibold">🩺 คนไข้ทั้งหมด</div>
    <input class="search" type="search" id="pq" placeholder="ค้นหา หมู่บ้าน ตำบล ประธาน" aria-label="ค้นหา" value=${q} onInput=${(e) => setQ(e.target.value)} />
    ${districts.length > 1 ? html`<div class="crumbs"><button class=${'chip' + (!d ? ' on' : '')} type="button" onClick=${() => setD('')}>ทุกอำเภอ</button>${districts.map((x) => html`<button key=${x} class=${'chip' + (d === x ? ' on' : '')} type="button" onClick=${() => setD(x)}>อ.${x}</button>`)}</div>` : null}
    <div class="crumbs">${[['all', 'ทั้งหมด ' + a.n], ['good', 'เงินครบ ' + a.good], ['sick', 'ป่วย ' + a.sick], ['ดีมาก', '😊 ' + a.dm], ['ดี', '🙂 ' + a.d], ['เริ่มป่วย', '🤒 ' + a.ss], ['ป่วยหนัก', '🚑 ' + a.sh]].map(([k, l]) => html`<button key=${k} class=${'chip' + (f === k ? ' on' : '')} type="button" aria-pressed=${f === k} onClick=${() => setF(k)}>${l}</button>`)}</div>
    <div class="muted small">แสดง ${list.length} หมู่บ้าน · เรียงจากรวมสุทธิน้อยไปมาก</div>
    <div class="grid gap-2">${list.map((v) => html`<${VRow} key=${v.id} v=${v} checked=${!!game.checked[v.id]} onOpen=${openVillage} />`)}</div>
  </section>`;
}

    'จัดทำโดย หมอแก้หนี้ by Olifsuriya',

        <button class="btn btn-navy" type="button" disabled=${!mcpOk || sync.busy} onClick=${pullSheet}>⬇️ ดึงจากชีต</button>
        <button class="btn btn-ghost" type="button" disabled=${!mcpOk || sync.busy} onClick=${() => setModal({ type: 'confirmPush', run: ctx.pushAll })}>⬆️ ส่งขึ้นชีตทั้งหมด</button>
      </div>
      <button class="btn btn-ghost" type="button" disabled=${!mcpOk || sync.busy} onClick=${readOldXlsx}>📂 อ่านไฟล์ Excel เดิมจาก Drive</button>
      <p class="small muted">แก้ตัวเลขในหน้าหมู่บ้านแล้วกดบันทึก แอปจะอัปเดตแถวนั้นในชีตให้ทันที ส่วนคนที่แก้ในชีต ให้กด "ดึงจากชีต" เพื่อเอาค่าล่าสุดมา</p>
      ${sync.busy ? html`<div class="flex items-center gap-2 small"><div class="spin" style=${{ width: 20, height: 20, borderWidth: 3 }}></div>${sync.msg}</div>` : null}
      ${!sync.busy && sync.msg ? html`<div class="small" style=${{ color: 'var(--good)' }}>✓ ${sync.msg}</div>` : null}
      ${sync.err ? html`<div class="small" style=${{ color: 'var(--bad)' }}>${sync.err}</div>` : null}
    </section>

    <section class="card grid gap-3">
      <div class="font-semibold">📤 ส่งออก</div>
      <div class="grid grid-cols-2 gap-2"><button class="btn btn-navy" type="button" onClick=${() => exportExcel(villages)}>📊 Excel (.xlsx)</button><button class="btn btn-ghost" type="button" onClick=${() => exportCSV(villages)}>📄 CSV</button></div>
    </section>

    <button class="btn btn-danger" type="button" onClick=${() => setModal({ type: 'confirmReset', title: 'กลับไปใช้ข้อมูลตั้งต้น?', body: 'ข้อมูลที่นำเข้าหรือแก้ในเครื่องนี้จะหาย และกลับไปใช้ข้อมูลชีต 57 หมู่บ้านของ อ.โนนสัง', run: () => { setVillages(seed()); setMeta({ source: 'ข้อมูลชีต ปีงบประมาณ 2569', at: new Date().toISOString(), sheetRows: null }); } })}>กลับไปใช้ข้อมูลตั้งต้น</button>
  </section>`;
}

/* ================= me (game) ================= */
function Me(ctx) {
  const { game, villages, setModal, setGame } = ctx;
  const lv = levelOf(game.xp), into = game.xp % 400;
  const checked = villages.filter((v) => game.checked[v.id]).length;
  const sickAll = villages.filter((v) => !v.good); const sickDone = sickAll.filter((v) => game.checked[v.id]).length;
  const tambons = uniq(villages.map((v) => v.district + '|' + v.tambon));
  const fullWards = tambons.filter((k) => villages.filter((v) => v.district + '|' + v.tambon === k).every((v) => game.checked[v.id])).length;
  const badges = [
    ['🩺', 'ตรวจคนไข้รายแรก', checked >= 1], ['🏥', 'ตรวจครบ 1 วอร์ด', fullWards >= 1], ['🚑', 'ดูแลเคสป่วยครบ', sickAll.length > 0 && sickDone === sickAll.length],
    ['🧭', 'ตรวจครบทุกหมู่บ้าน', checked === villages.length && villages.length > 0], ['⭐', 'ถึง Lv3', lv >= 3], ['👑', 'หมอใหญ่ กข.คจ.', lv >= 5],
  ];
  return html`<section class="grid gap-3">
    <section class="hero grid gap-3 justify-items-center text-center">
      <${Logo} size=${110} /><span class="chip on" style=${{ fontWeight: 600 }}>Lv${lv}</span>
      <div class="text-2xl font-bold">${rankOf(game.xp)}</div>
      <div class="w-full max-w-xs"><div class="xpbar" style=${{ height: 10 }}><i style=${{ width: (into / 4) + '%' }}></i></div><div class="small mt-1 num">${into}/400 XP · รวม ${b0(game.xp)} XP · ${b0(game.coins)} <i class="coin"></i></div></div>
    </section>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${checked}</div><div class="small muted">ตรวจแล้ว/${villages.length}</div></div>
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${sickDone}</div><div class="small muted">เคสป่วย/${sickAll.length}</div></div>
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${fullWards}</div><div class="small muted">วอร์ดครบ/${tambons.length}</div></div>
    </div>
    <section class="card grid gap-2"><div class="font-semibold">🏅 เหรียญตรา</div><div class="grid grid-cols-3 gap-2">${badges.map(([i, l, ok]) => html`<div key=${l} class="text-center" style=${{ opacity: ok ? 1 : .35, border: '1.5px solid var(--line)', borderRadius: 14, padding: 8 }}><div class="text-2xl">${i}</div><div class="small">${l}</div></div>`)}</div></section>
    <section class="card grid gap-1 small muted"><div class="font-semibold" style=${{ color: 'var(--fg)' }}>วิธีเก็บ XP</div><p>ตรวจหมู่บ้านที่เงินครบ +20 XP · ดูแลเคสป่วย +40 XP · เปิดวอร์ดใหม่ +5 · นำเข้าไฟล์ +50 · ซิงค์ชีต +30 · ส่งออก +15 · ทุก 400 XP เลื่อน 1 ขั้น</p><p>คะแนนเก็บในเครื่องนี้เท่านั้น</p></section>
    <button class="btn btn-danger" type="button" onClick=${() => setModal({ type: 'confirmReset', title: 'เริ่มเกมใหม่?', body: 'XP เหรียญ และสถานะตรวจแล้วทั้งหมดในเครื่องนี้จะถูกล้าง', run: () => setGame({ xp: 0, coins: 0, checked: {}, wards: {}, badges: {} }) })}>เริ่มเกมใหม่</button>
  </section>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
