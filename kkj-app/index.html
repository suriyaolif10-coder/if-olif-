const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const num = (v) => { if (typeof v === 'number') return Number.isFinite(v) ? v : 0; const s = String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''); const x = parseFloat(s); return Number.isFinite(x) ? x : 0; };
const txt = (v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
const baht = (n) => (Math.round((+n || 0) * 100) / 100).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + baht(Math.abs(n));

const key = (s) => txt(s).replace(/\s+/g, '');

/* สูตร: รวมสุทธิ (รวมเสี่ยง) = บัญชี + (ลูกหนี้ + เสี่ยง) − เสี่ยง − เสียหาย = บัญชี + ลูกหนี้ − เสียหาย

function finish(v) {
  v.district = txt(v.district) || 'โนนสัง';
  v.province = txt(v.province) || 'หนองบัวลำภู';
  v.tambon = txt(v.tambon).replace(/^(ต\.|ตำบล)\s*/, '');
  v.moo = txt(v.moo).replace(/^(ม\.|หมู่ที่|หมู่)\s*/, '');
  v.name = normName(v.name);
  ['deposit', 'loaned', 'problem', 'damaged', 'fund', 'hh', 'problemHH', 'damagedHH', 'savers', 'savings'].forEach((k) => { v[k] = num(v[k]); });
  v.risk = Math.round((v.problem + v.damaged) * 100) / 100;
  v.circ = Math.round((v.deposit + v.loaned) * 100) / 100;
  v.net = Math.round((v.deposit + v.loaned - v.damaged) * 100) / 100;
  v.gap = Math.round((v.net - STD) * 100) / 100;
  const s = statusOf(v.net); v.status = s.id; v.statusLabel = s.label;
  v.good = v.net >= STD - 0.004;
  const pc = POSTAL[v.district] || txt(v.postal);
  v.address = v.addressOverride || [v.name, 'หมู่ที่ ' + v.moo, 'ต.' + v.tambon, 'อ.' + v.district, 'จ.' + v.province, pc].filter(Boolean).join(' ');
  v.id = v.district + '-' + v.tambon + '-' + v.moo + '-' + v.name;
  return v;
}

    const risk = num(g('risk'));

function rowsFromDriveText(text) {

function loadXLSX() {

async function readAnyFile(file) {

/* ================= small components ================= */
function Logo({ size = 52, src }) { return html`<img src=${src || LOGO} alt="" width=${size} height=${size} style=${{ width: size, height: size, borderRadius: '50%', display: 'block', background: 'var(--cream)' }} />`; }
function Status({ v }) { return html`<span class=${'st st-' + v.status}>${v.statusLabel}</span>`; }
function Money({ a, label }) {
  return html`<div class="grid grid-cols-2 gap-2">
    <div class="money" style=${{ gridColumn: '1 / -1' }}><div class="k">หมุนเวียน (บัญชี + ลูกหนี้)${label ? ' · ' + label : ''}</div><div class="v">${b0(a.circ)} ฿</div></div>
    <div class="money risk"><div class="k">เสี่ยงรวม</div><div class="v">${b0(a.risk)} ฿</div></div>
    <div class="money net"><div class="k">สุทธิ</div><div class="v">${b0(a.net)} ฿</div></div>
  </div>`;
}
function Gauge({ a }) {
  const w = (x) => (a.n ? (x / a.n) * 100 : 0) + '%';
  return html`<div class="gauge" role="img" aria-label=${'ดีมาก ' + a.dm + ' ดี ' + a.d + ' เริ่มป่วย ' + a.ss + ' ป่วยหนัก ' + a.sh}>
    <i style=${{ width: w(a.dm), background: 'var(--good)' }}></i><i style=${{ width: w(a.d), background: 'var(--ok)' }}></i><i style=${{ width: w(a.ss), background: 'var(--warn)' }}></i><i style=${{ width: w(a.sh), background: 'var(--bad)' }}></i></div>`;
}
function Tiles({ list, onOpen }) {
  const a = agg(list);
  return html`<div class="grid grid-cols-3 gap-2">
    <button class="tile" type="button" onClick=${() => onOpen('all')}><span class="k">ทั้งหมด</span><span class="v">${a.n}</span><span class="s">หมู่บ้าน ›</span></button>
    <button class="tile good" type="button" onClick=${() => onOpen('good')}><span class="k">เงินครบ ≥280K</span><span class="v">${a.good}</span><span class="s">ดีมาก ${a.dm} + ดี ${a.d} ›</span></button>
    <button class="tile sick" type="button" onClick=${() => onOpen('sick')}><span class="k">ป่วย</span><span class="v">${a.sick}</span><span class="s">ต้องดูแล ›</span></button>
  </div>`;
}
function VRow({ v, onOpen, checked }) {
  return html`<button class="vrow" type="button" onClick=${() => onOpen(v)}>
    <div class="row items-start"><div class="min-w-0"><div class="font-semibold">${v.name} <span class="muted small">หมู่ ${v.moo}</span></div><div class="muted small">ต.${v.tambon} อ.${v.district}</div></div><${Status} v=${v} /></div>
    <div class="row small"><span class="muted">สุทธิ</span><b class="num" style=${{ color: v.good ? 'var(--fg)' : 'var(--bad)' }}>${baht(v.net)} ฿</b></div>
    <div class="row small"><span class="muted">ขาด/เกิน</span><span class="num" style=${{ color: v.gap < 0 ? 'var(--bad)' : 'var(--good)' }}>${signed(v.gap)} ฿</span></div>
    ${checked ? html`<div><span class="stamp">ตรวจแล้ว</span></div>` : null}
  </button>`;
}
function Modal({ title, sub, onClose, children, footer }) {
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  return html`<div class="overlay" role="dialog" aria-modal="true" aria-label=${title} onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="modal">
      <div class="mh"><div class="min-w-0"><div class="text-lg font-semibold">${title}</div>${sub ? html`<div class="muted small">${sub}</div>` : null}</div><button class="x" type="button" aria-label="ปิด" onClick=${onClose}>✕</button></div>
      <div class="mb">${children}</div>
      ${footer ? html`<div class="mf">${footer}</div>` : null}
    </div></div>`;
}

/* ================= splash ================= */
function Splash({ onDone }) {
  const [out, setOut] = useState(false);
  useEffect(() => { const t = setTimeout(() => setOut(true), SPLASH_MS); return () => clearTimeout(t); }, []);
  useEffect(() => { if (out) { const t = setTimeout(onDone, 800); return () => clearTimeout(t); } }, [out]);
  return html`<div class=${'splash' + (out ? ' out' : '')} aria-label="เข็มทิศแก้หนี้ กข.คจ.">
    <button class="skip" type="button" onClick=${() => setOut(true)}>ข้าม ›</button>
    <div>
      <div class="lockup">
        <div class="top a-top">เข็มทิศแก้หนี้</div>
        <img class="a-logo" src=${LOGO} alt="หมอแก้หนี้" />
        <div class="bot a-bot">กข.คจ.</div>
      </div>
      <div class="loading"><span>กำลังโหลด...</span><span class="bar"><i></i></span><span class="small" style=${{ opacity: .7 }}>หมอแก้หนี้ by Olifsuriya</span></div>
    </div>
  </div>`;
}

/* ================= app ================= */
function App() {
  const [splash, setSplash] = useState(true);
  const [villages, setVillages] = useState(() => { const s = store.get(K.data, null); return Array.isArray(s) && s.length ? s.map(finish) : seed(); });
  const [meta, setMeta] = useState(() => store.get(K.meta, { source: 'ข้อมูลชีต ปีงบประมาณ 2569', at: null, sheetRows: null }));
  const [game, setGame] = useState(() => Object.assign({ xp: 0, coins: 0, checked: {}, wards: {}, badges: {} }, store.get(K.game, {})));
  const [tab, setTab] = useState('clinic');
  const [path, setPath] = useState({});
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [mcpOk, setMcpOk] = useState(null);
  const toastT = useRef();

  useEffect(() => { store.set(K.data, villages); }, [villages]);
  useEffect(() => { store.set(K.meta, meta); }, [meta]);
  useEffect(() => { store.set(K.game, game); }, [game]);
  useEffect(() => { capReady.then(() => setMcpOk(!!cap.mcp)); }, []);

  const say = useCallback((m) => { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(null), 2600); }, []);
  const award = useCallback((xp, coins, msg) => {
    setGame((g) => { const before = levelOf(g.xp); const n = Object.assign({}, g, { xp: g.xp + xp, coins: g.coins + coins }); if (levelOf(n.xp) > before) setTimeout(() => say(rankIdx(n.xp) > rankIdx(g.xp) ? '🎉 เลื่อนตำแหน่งเป็น ' + rankOf(n.xp) : '🎉 ขึ้น Lv' + levelOf(n.xp)), 900); return n; });
    say(msg + ' +' + xp + ' XP' + (coins ? ' +' + coins + ' เหรียญ' : ''));
  }, [say]);

  const go = (p, t) => { setPath(p); if (t) setTab(t); setModal(null); window.scrollTo({ top: 0 }); };
  const openVillage = (v) => go({ district: v.district, tambon: v.tambon, id: v.id }, 'clinic');
  const openList = (list, kind, scope) => {
    const sel = kind === 'good' ? list.filter((v) => v.good) : kind === 'sick' ? list.filter((v) => !v.good) : list;
    const title = (kind === 'good' ? 'เงินครบ ≥280K' : kind === 'sick' ? 'ป่วย · ต้องดูแล' : 'ทั้งหมด') + ' · ' + sel.length + ' หมู่บ้าน';
    setModal({ type: 'list', title, sub: scope, items: sel.slice().sort((a, b) => a.net - b.net) });
  };

  function replaceVillages(rows, label) {
    const districts = new Set(rows.map((v) => v.district));
    setVillages((cur) => cur.filter((v) => !districts.has(v.district)).concat(rows));
    setMeta((m) => Object.assign({}, m, { source: label, at: new Date().toISOString() }));
    return [...districts];
  }

  /* ---------- import ---------- */
  async function importFile(file) {
    setModal({ type: 'import', stage: 'reading', name: file.name });
    try {
      const rows = await readAnyFile(file);
      if (!rows.length) throw new Error('ไม่พบแถวข้อมูลหมู่บ้าน ตรวจว่าเป็นชีต (กข.คจ.) แยกตามจังหวัด หรือ CSV ที่มีหัว หมู่บ้าน, บัญชี, ลูกหนี้');
      const ds = replaceVillages(rows, 'ไฟล์ ' + file.name);
      setModal({ type: 'import', stage: 'done', name: file.name, rows, districts: ds });
      award(50, 20, 'นำเข้า ' + rows.length + ' หมู่บ้าน');
    } catch (e) { setModal({ type: 'import', stage: 'error', name: file.name, error: e.message || String(e) }); }
  }

  /* ---------- Google Sheets / Drive ---------- */
  const [sync, setSync] = useState({ busy: false, msg: '', err: '' });
  async function pullSheet() {
    setSync({ busy: true, msg: 'กำลังดึงข้อมูลจาก Google Sheets...', err: '' });
    try {
      const r = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: SHEET_ID, range: 'A1:N1000' }, { cache: false });
      const values = (r.payload && r.payload.values) || [];
      const rows = rowsFromHeaders(values) || [];
      if (!rows.length) throw new Error('ไม่พบแถวข้อมูลในชีต');
      // keep the problem/damaged split from local data when the total matches
      const local = new Map(villages.map((v) => [key(v.tambon) + '|' + key(v.moo) + '|' + key(v.name), v]));
      const merged = rows.map((v) => { const o = local.get(key(v.tambon) + '|' + key(v.moo) + '|' + key(v.name)); if (!o) return v;
        const keep = Math.abs(o.risk - v.problem) < 0.01; return finish(Object.assign({}, o, { chair: v.chair || o.chair, phone: v.phone || o.phone, deposit: v.deposit, loaned: v.loaned, problem: keep ? o.problem : v.problem, damaged: keep ? o.damaged : 0, no: v.no })); });
      replaceVillages(merged, 'Google Sheets (ดึงล่าสุด)');
      setMeta((m) => Object.assign({}, m, { sheetRows: values.length - 1, source: 'Google Sheets (ดึงล่าสุด)', at: new Date().toISOString() }));
      setSync({ busy: false, msg: 'ดึงข้อมูลแล้ว ' + merged.length + ' หมู่บ้าน', err: '' });
      award(30, 10, 'ซิงค์จากชีต');
    } catch (e) { setSync({ busy: false, msg: '', err: mcpMessage(e, SHEETS) }); }
  }
  async function pushSheet() {
    setModal(null);
    setSync({ busy: true, msg: 'กำลังส่งข้อมูลขึ้น Google Sheets...', err: '' });
    try {
      const list = villages.filter((v) => v.district === 'โนนสัง').sort((a, b) => a.no - b.no);
      const cur = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: SHEET_ID, range: 'A1:N1000' }, { cache: false });
      const have = Math.max(0, (((cur.payload && cur.payload.values) || []).length) - 1);
      const n = list.length;
      const ai = list.map((v, i) => [i + 1, isNaN(+v.moo) ? v.moo : +v.moo, v.tambon, v.name, v.chair, v.phone, v.deposit, v.loaned, v.risk]);
      const ln = list.map((v) => [v.statusLabel, v.address, v.tambon]);
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'A2:I' + (n + 1), values: ai }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'L2:N' + (n + 1), values: ln }, { cache: false });
      if (n > have) { // new rows have no formula yet: write the computed numbers
        const jk = list.slice(have).map((v) => [v.net, v.gap]);
        await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'J' + (have + 2) + ':K' + (n + 1), values: jk }, { cache: false });
      }
      if (have > n) {
        const blank = Array.from({ length: have - n }, () => Array(14).fill(''));
        await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'A' + (n + 2) + ':N' + (have + 1), values: blank }, { cache: false });
      }
      setSync({ busy: false, msg: 'ส่งขึ้นชีตแล้ว ' + n + ' หมู่บ้าน (อ.โนนสัง)', err: '' });
      award(30, 10, 'ส่งข้อมูลขึ้นชีต');
    } catch (e) { setSync({ busy: false, msg: '', err: mcpMessage(e, SHEETS) + ' (ข้อมูลในชีตอาจถูกเขียนไปบางส่วน ให้กดดึงข้อมูลเพื่อตรวจ)' }); }
  }
  async function pushReportOne(v) {
    try {
      const cur = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: REPORT_ID, range: 'A1:F1000' }, { cache: false });
      const values = (cur.payload && cur.payload.values) || [];
      const want = vKey(v.tambon, v.moo, v.name);
      const idx = values.findIndex((r, i) => i >= 3 && /^\d+$/.test(txt(r[0])) && vKey(r[3], r[4], r[5]) === want);
      if (idx < 0) return 'รายงาน กข.คจ.: ไม่พบหมู่บ้านนี้';
      const r = idx + 1;
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'L' + r + ':M' + r, values: [[v.loaned, v.deposit]] }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'X' + r, values: [[v.problem]] }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'AB' + r, values: [[v.damaged]] }, { cache: false });
      return 'รายงาน กข.คจ.: อัปเดตแถว ' + r + ' แล้ว';
    } catch (e) { return 'รายงาน กข.คจ.: ' + mcpMessage(e, SHEETS); }
  }
  async function pushOne(v) {
    const a = await pushReportOne(v);
    const b = await pushNativeOne(v);
    return a + ' · ' + b;
  }
  async function pushNativeOne(v) {
    try {
      const cur = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: SHEET_ID, range: 'A1:N1000' }, { cache: false });
      const values = (cur.payload && cur.payload.values) || [];
      const idx = values.findIndex((r, i) => i > 0 && key(r[2]) === key(v.tambon) && key(r[1]) === key(v.moo) && key(r[3]) === key(v.name));
      if (idx < 0) return 'ชีตคลินิก: ไม่พบหมู่บ้านนี้';
      const r = idx + 1;
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'G' + r + ':I' + r, values: [[v.deposit, v.loaned, v.risk]] }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: SHEET_ID, range: 'L' + r, values: [[v.statusLabel]] }, { cache: false });
      return 'ชีตคลินิก: อัปเดตแถว ' + r + ' แล้ว';
    } catch (e) { return 'ชีตคลินิก: ' + mcpMessage(e, SHEETS); }
  }
  async function pullReport() {
    setSync({ busy: true, msg: 'กำลังดึงรายงาน กข.คจ. จาก Google Sheets...', err: '' });
    try {
      const r = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: REPORT_ID, range: 'A1:AI1000' }, { cache: false });
      const rows = rowsFromGrid((r.payload && r.payload.values) || []) || [];
      if (!rows.length) throw new Error('ไม่พบแถวข้อมูลหมู่บ้านในรายงาน');
      replaceVillages(rows, 'รายงาน กข.คจ. (Google Sheets)');
      setSync({ busy: false, msg: 'ดึงรายงานแล้ว ' + rows.length + ' หมู่บ้าน', err: '' });
      award(30, 10, 'ซิงค์จากรายงาน');
    } catch (e) { setSync({ busy: false, msg: '', err: e.code ? mcpMessage(e, SHEETS) : e.message }); }
  }
  async function pushReport() {
    setModal(null);
    setSync({ busy: true, msg: 'กำลังส่งตัวเลขขึ้นรายงาน กข.คจ....', err: '' });
    try {
      const cur = await cap.mcp.callTool(SHEETS, 'get_values', { spreadsheetId: REPORT_ID, range: 'A1:AI1000' }, { cache: false });
      const values = (cur.payload && cur.payload.values) || [];
      const dataIdx = values.map((r, i) => (i >= 3 && /^\d+$/.test(txt(r[0])) ? i : -1)).filter((i) => i >= 0);
      if (!dataIdx.length) throw new Error('ไม่พบแถวหมู่บ้านในรายงาน');
      const first = dataIdx[0], last = dataIdx[dataIdx.length - 1];
      const byKey = new Map(villages.map((v) => [v.district + '|' + vKey(v.tambon, v.moo, v.name), v]));
      const LM = [], X = [], AB = []; let matched = 0;
      for (let i = first; i <= last; i++) {
        const r = values[i] || [];
        const v = dataIdx.includes(i) ? byKey.get(txt(r[2]).replace(/^(อ\.|อำเภอ)\s*/, '') + '|' + vKey(r[3], r[4], r[5])) : null;
        if (v) matched++;
        LM.push(v ? [v.loaned, v.deposit] : [num(r[11]), num(r[12])]);
        X.push([v ? v.problem : num(r[23])]); AB.push([v ? v.damaged : num(r[27])]);
      }
      const a = first + 1, b = last + 1;
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'L' + a + ':M' + b, values: LM }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'X' + a + ':X' + b, values: X }, { cache: false });
      await cap.mcp.callTool(SHEETS, 'update_values', { spreadsheetId: REPORT_ID, range: 'AB' + a + ':AB' + b, values: AB }, { cache: false });
      const districts = new Set(dataIdx.map((i) => txt(values[i][2])));
      const missing = villages.filter((v) => districts.has(v.district)).length - matched;
      setSync({ busy: false, msg: 'ส่งขึ้นรายงานแล้ว ' + matched + ' หมู่บ้าน' + (missing > 0 ? ' · ' + missing + ' หมู่บ้านในแอปไม่มีในรายงาน จึงไม่ได้เพิ่ม' : ''), err: '' });
      award(30, 10, 'ส่งตัวเลขขึ้นรายงาน');
    } catch (e) { setSync({ busy: false, msg: '', err: (e.code ? mcpMessage(e, SHEETS) : e.message) + ' (ถ้าเขียนไปบางส่วน ให้กดดึงรายงานเพื่อตรวจ)' }); }
  }
  async function readOldXlsx() {
    setSync({ busy: true, msg: 'กำลังอ่านไฟล์ Excel เดิมจาก Google Drive...', err: '' });
    try {
      const r = await cap.mcp.callTool(DRIVE, 'read_file_content', { fileId: XLSX_FILE_ID }, { cache: false });
      const p = r.payload; const text = typeof p === 'string' ? p : (p && (p.fileContent || p.content)) || '';
      const rows = rowsFromDriveText(text);
      if (!rows.length) throw new Error('อ่านแถวข้อมูลจากไฟล์ไม่ได้ รูปแบบไฟล์อาจเปลี่ยนไป');
      replaceVillages(rows, 'ไฟล์ Excel เดิมใน Drive');
      setSync({ busy: false, msg: 'อ่านไฟล์เดิมแล้ว ' + rows.length + ' หมู่บ้าน', err: '' });
      award(30, 10, 'อ่านไฟล์เดิมจาก Drive');
    } catch (e) { setSync({ busy: false, msg: '', err: e.code ? mcpMessage(e, DRIVE) : e.message }); }
  }

  /* ---------- export ---------- */
  async function exportExcel(list) {
    try {
      const XLSX = await loadXLSX();
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['อำเภอ', 'ตำบล', 'หมู่บ้าน', 'เงินครบ', 'ป่วย', 'บัญชี', 'ลูกหนี้', 'เสี่ยง', 'สุทธิ']].concat(tambonRows(list))), 'สรุปรายตำบล');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([SHEET_HEAD].concat(villageRows(list))), 'รายหมู่บ้าน');
      const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      await saveFile('เข็มทิศแก้หนี้-กขคจ-' + new Date().toISOString().slice(0, 10) + '.xlsx', new Uint8Array(out), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      award(15, 5, 'ส่งออก Excel');
    } catch (e) { say(e && e.code === 'declined' ? 'ยกเลิกการบันทึกไฟล์' : e && e.code ? 'บันทึกไฟล์ไม่ได้ในหน้านี้' : 'โหลดตัวสร้าง Excel ไม่ได้ ใช้ส่งออก CSV แทน'); }
  }
  async function exportCSV(list) {
    try { await saveFile('เข็มทิศแก้หนี้-กขคจ-' + new Date().toISOString().slice(0, 10) + '.csv', toCSV([SHEET_HEAD].concat(villageRows(list))), 'text/csv'); award(15, 5, 'ส่งออก CSV'); }
    catch (e) { say(e && e.code === 'declined' ? 'ยกเลิกการบันทึกไฟล์' : 'บันทึกไฟล์ไม่ได้ในหน้านี้'); }
  }

  /* ---------- village actions ---------- */
  function updateVillage(id, patch) { setVillages((cur) => cur.map((v) => (v.id === id ? finish(Object.assign({}, v, patch)) : v))); }
  function checkVillage(v) {
    if (game.checked[v.id]) return;
    setGame((g) => Object.assign({}, g, { checked: Object.assign({}, g.checked, { [v.id]: new Date().toISOString() }) }));
    award(v.good ? 20 : 40, v.good ? 10 : 30, v.good ? 'ตรวจสุขภาพแล้ว' : 'ดูแลเคสป่วยแล้ว');
  }
  function enterWard(district, tambon) {
    const k = district + '|' + tambon;
    if (!game.wards[k]) { setGame((g) => Object.assign({}, g, { wards: Object.assign({}, g.wards, { [k]: 1 }) })); award(5, 0, 'เปิดวอร์ด ต.' + tambon); }
    go({ district, tambon });
  }

  const fileRef = useRef();
  const pickFile = () => { if (fileRef.current) fileRef.current.click(); };
  const onFile = (e) => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; };

  const lv = levelOf(game.xp), into = game.xp % 400;
  const ctx = { villages, meta, game, path, go, openVillage, openList, enterWard, checkVillage, updateVillage, pushOne, setModal, say, award, pickFile, mcpOk, sync, pullSheet, readOldXlsx, exportExcel, exportCSV, setTab, setVillages, setMeta, setGame, pushAll: pushSheet, pullReport, pushReport };

  return html`<${React.Fragment}>
    ${splash ? html`<${Splash} onDone=${() => setSplash(false)} />` : null}
    <input ref=${fileRef} id="fileInput" class="hidden-file" type="file" accept=".xlsx,.xls,.csv" style=${{ position: 'absolute', left: '-9999px' }} onChange=${onFile} />
    <div class="shell">
      <header class="hud gut">
        <div class="flex items-center gap-3">
          <div class="avatar"><${Logo} size=${52} src=${mascotOf(game.xp)} /><span class="lv">Lv${lv}</span></div>
          <div class="min-w-0 flex-1">
            <div class="brand-t">เข็มทิศแก้หนี้ กข.คจ.</div>
            <div class="muted small truncate">หมอแก้หนี้ by Olifsuriya · ${rankOf(game.xp)}</div>
            <div class="flex items-center gap-2 small mt-1"><span class="xpbar flex-1" style=${{ maxWidth: 140 }}><i style=${{ width: (into / 4) + '%' }}></i></span><span class="num muted">${into}/400 XP</span><span class="num">${b0(game.coins)} <i class="coin" aria-label="เหรียญ"></i></span></div>
          </div>
          <button class="btn btn-gold" type="button" style=${{ minHeight: 40, padding: '8px 12px' }} onClick=${pickFile}>📥 นำเข้า</button>
        </div>
      </header>
      <main class="screen gut">
        ${tab === 'clinic' ? html`<${Clinic} ...${ctx} />` : null}
        ${tab === 'patients' ? html`<${Patients} ...${ctx} />` : null}
        ${tab === 'report' ? html`<${Report} ...${ctx} />` : null}
        ${tab === 'data' ? html`<${DataTab} ...${ctx} />` : null}
        ${tab === 'me' ? html`<${Me} ...${ctx} />` : null}
      </main>
      <nav class="tabs" aria-label="เมนูหลัก"><div class="in">
        ${[['clinic', '🏥', 'คลินิก'], ['patients', '🩺', 'คนไข้'], ['report', '📋', 'รายงาน'], ['data', '📥', 'ข้อมูล'], ['me', '🎮', 'หมอ']].map(([id, ic, l]) => html`
          <button key=${id} type="button" aria-current=${tab === id ? 'page' : null} onClick=${() => { setTab(id); if (id === 'clinic') setPath({}); window.scrollTo({ top: 0 }); }}><span class="ic" aria-hidden="true">${ic}</span>${l}</button>`)}

/* ================= modal host ================= */
function ModalHost({ modal, ctx, close }) {
  if (modal.type === 'list') {
    return html`<${Modal} title=${modal.title} sub=${modal.sub} onClose=${close}>
      ${modal.items.length ? modal.items.map((v) => html`<${VRow} key=${v.id} v=${v} checked=${!!ctx.game.checked[v.id]} onOpen=${ctx.openVillage} />`) : html`<p class="muted">ไม่มีหมู่บ้านในกลุ่มนี้</p>`}
    </${Modal}>`;
  }
  if (modal.type === 'import') {
    if (modal.stage === 'reading') return html`<${Modal} title="กำลังอ่านไฟล์..." sub=${modal.name} onClose=${close}><div class="grid justify-items-center gap-3 py-6"><div class="spin"></div><p class="muted">กำลังอ่านและคำนวณ รวมสุทธิ = บัญชี + ลูกหนี้ − เสียหาย</p></div></${Modal}>`;
    if (modal.stage === 'error') return html`<${Modal} title="นำเข้าไม่สำเร็จ" sub=${modal.name} onClose=${close} footer=${html`<button class="btn btn-gold flex-1" type="button" onClick=${() => { close(); ctx.pickFile(); }}>เลือกไฟล์ใหม่</button>`}><p style=${{ color: 'var(--bad)' }}>${modal.error}</p></${Modal}>`;
    const a = agg(modal.rows);
    return html`<${Modal} title=${'นำเข้าสำเร็จ ' + modal.rows.length + ' หมู่บ้าน'} sub=${modal.name + ' · อ.' + modal.districts.join(', อ.')} onClose=${close}
      footer=${html`<button class="btn btn-navy flex-1" type="button" onClick=${() => ctx.go({}, 'clinic')}>ไปหน้า อำเภอ ›</button>`}>
      <p class="small muted">เงินครบ ${a.good} · ป่วย ${a.sick} · ข้อมูลอำเภอเดิมที่ชื่อซ้ำถูกแทนที่ด้วยไฟล์นี้</p>
      <p class="small font-semibold">5 รายการแรก</p>
      ${modal.rows.slice(0, 5).map((v) => html`<div key=${v.id} class="card" style=${{ padding: 12 }}><div class="row"><b>${v.name}</b><${Status} v=${v} /></div><div class="muted small">${v.address}</div><div class="small num">${baht(v.deposit)} + ${baht(v.loaned)} − ${baht(v.damaged)} = <b>${baht(v.net)}</b></div></div>`)}
    </${Modal}>`;
  }
  if (modal.type === 'confirmPush') {
    return html`<${Modal} title=${modal.title || 'ส่งขึ้น Google Sheets ทั้งหมด?'} onClose=${close} footer=${html`<button class="btn btn-ghost flex-1" type="button" onClick=${close}>ยกเลิก</button><button class="btn btn-gold flex-1" type="button" onClick=${modal.run}>ยืนยัน เขียนทับ</button>`}>
      <p>${modal.body || 'แอปจะเขียนข้อมูล อ.โนนสัง ทุกหมู่บ้านทับคอลัมน์ A–I และ L–N ในชีต "คลินิกแก้หนี้ NBL 280K" สูตรในคอลัมน์ J–K ยังอยู่เหมือนเดิม'}</p>
      <p class="muted small">ถ้ามีคนแก้ชีตหลังจากที่ดึงข้อมูลล่าสุด การแก้นั้นจะถูกทับ แนะนำให้กด "ดึงจากชีต" ก่อน</p>
    </${Modal}>`;
  }
  if (modal.type === 'confirmReset') {
    return html`<${Modal} title=${modal.title} onClose=${close} footer=${html`<button class="btn btn-ghost flex-1" type="button" onClick=${close}>ยกเลิก</button><button class="btn btn-danger flex-1" type="button" onClick=${() => { modal.run(); close(); }}>ยืนยัน</button>`}><p>${modal.body}</p></${Modal}>`;
  }
  return null;
}

/* ================= clinic (drill-down) ================= */
function Crumbs({ path, go, villages }) {
  const v = path.id ? villages.find((x) => x.id === path.id) : null;
  const items = [{ l: 'อำเภอ', p: {} }];
  if (path.district) items.push({ l: 'อ.' + path.district, p: { district: path.district } });
  if (path.tambon) items.push({ l: 'ต.' + path.tambon, p: { district: path.district, tambon: path.tambon } });
  if (v) items.push({ l: v.name, p: path });
  return html`<nav class="crumbs" aria-label="ตำแหน่ง">
    ${items.length > 1 ? html`<button class="chip" type="button" aria-label="ย้อนกลับ" onClick=${() => go(items[items.length - 2].p)}>‹</button>` : null}
    ${items.map((it, i) => html`<${React.Fragment} key=${i}>${i ? html`<span class="muted" aria-hidden="true">›</span>` : null}<button class=${'chip' + (i === items.length - 1 ? ' on' : '')} type="button" aria-current=${i === items.length - 1 ? 'page' : null} onClick=${() => go(it.p)}>${it.l}</button></${React.Fragment}>`)}
  </nav>`;
}
function UnitCard({ title, badge, sub, list, primary, onPrimary, secondary, onSecondary }) {
  const a = agg(list);

    <div class="flex items-center gap-3"><div style=${{ padding: 4, borderRadius: '50%', border: '3px solid var(--card-2)' }}><${Logo} size=${54} /></div>
      <div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><span class="text-xl font-semibold" style=${{ color: 'var(--navy-hi)' }}>${title}</span>${badge ? html`<span class="chip on" style=${{ fontSize: '.75rem', padding: '2px 10px' }}>${badge}</span>` : null}</div><div class="muted small">${sub}</div></div></div>
    <${Money} a=${a} />
    <${Gauge} a=${a} />
    <div class="small"><b style=${{ color: 'var(--good)' }}>เงินครบ ${a.good} = ดี</b><span class="muted"> · ดีมาก ${a.dm} · ดี ${a.d}</span> · <b style=${{ color: a.sick ? 'var(--bad)' : 'var(--muted)' }}>ป่วย ${a.sick}</b><span class="muted"> (เริ่มป่วย ${a.ss} · ป่วยหนัก ${a.sh})</span></div>
    <div class="grid grid-cols-2 gap-2"><button class="btn btn-navy" type="button" onClick=${onPrimary}>${primary}</button><button class="btn btn-ghost" type="button" onClick=${onSecondary}>${secondary}</button></div>
  </section>`;
}

      <div class="grid gap-2">${list.map((v) => html`<${VRow} key=${v.id} v=${v} checked=${!!ctx.game.checked[v.id]} onOpen=${ctx.openVillage} />`)}</div>`;

    return html`<${Crumbs} ...${ctx} />
      <section class="hero grid gap-3"><div class="text-2xl font-bold">อำเภอ${path.district}</div><div class="small" style=${{ color: '#cfdaea' }}>${scope} · ${tambons.length} ตำบล · ${dl.length} หมู่บ้าน</div><${Tiles} list=${dl} onOpen=${(k) => openList(dl, k, scope)} /></section>
      ${tambons.map(({ t, list }) => html`<${UnitCard} key=${t} title=${'ตำบล ' + t} badge=${'อ.' + path.district} sub=${list.length + ' หมู่บ้าน · ต.' + t + ' อ.' + path.district} list=${list}
        primary=${'เข้าวอร์ด › ' + list.length + ' หมู่'} onPrimary=${() => enterWard(path.district, t)} secondary=${'ป่วย ' + agg(list).sick + ' ›'} onSecondary=${() => openList(list, 'sick', 'ต.' + t)} />`)}`;
  }
  const districts = districtsOf(villages);
  const provs = uniq(villages.map((v) => v.province));
  return html`
    <section class="hero grid gap-4">
      <div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="small font-semibold" style=${{ letterSpacing: '.12em', color: '#c9d7ec' }}>NBL 280K · หมอแก้หนี้ BY OLIFSURIYA</div><div class="text-3xl font-bold mt-1">คลินิกหนี้ 280K</div><div class="small mt-1" style=${{ color: '#cfdaea' }}>จ.${provs.join(', จ.')} · ${districts.length} อำเภอ · ${villages.length} หมู่บ้าน · ${ctx.meta.source}</div></div><div style=${{ borderRadius: '50%', border: '3px solid var(--navy-2)', flex: 'none' }}><${Logo} size=${60} /></div></div>
      <${Tiles} list=${villages} onOpen=${(k) => openList(villages, k, 'ทุกอำเภอ')} />
      <div class="small" style=${{ color: '#cfdaea' }}>รวมสุทธิ = บัญชี + ลูกหนี้ − เสียหาย · ขาด/เกิน = รวมสุทธิ − 280,000 · ≥ 280,000 = เงินครบ</div>
    </section>
    ${districts.map((d) => { const list = villages.filter((v) => v.district === d); const t = uniq(list.map((v) => v.tambon)).length;
      return html`<${UnitCard} key=${d} title=${'อำเภอ ' + d} badge=${'จ.' + list[0].province} sub=${'อ.' + d + ' จ.' + list[0].province + ' ' + (POSTAL[d] || '') + ' · ' + list.length + ' หมู่บ้าน'} list=${list}
        primary=${'ดูตำบล › ' + t + ' ตำบล'} onPrimary=${() => go({ district: d })} secondary=${'ดู ' + list.length + ' หมู่บ้าน ›'} onSecondary=${() => openList(list, 'all', 'อ.' + d)} />`; })}
    <button class="btn btn-gold" type="button" onClick=${ctx.pickFile}>📥 เลือกไฟล์ Excel/CSV เพิ่มอำเภอ</button>`;

/* ================= village (exam room) ================= */
function Village(ctx) {
  const { v, game, checkVillage, updateVillage, pushOne, say, villages, openVillage, mcpOk } = ctx;
  const [edit, setEdit] = useState(false);
  const [form, setForm] = useState({});
  const [pushMsg, setPushMsg] = useState('');
  const [pushing, setPushing] = useState(false);
  useEffect(() => { setEdit(false); setPushMsg(''); }, [v.id]);
  const checked = !!game.checked[v.id];
  const ward = villages.filter((x) => x.district === v.district && x.tambon === v.tambon && x.id !== v.id && !game.checked[x.id]).sort((a, b) => a.net - b.net);
  const next = ward[0];
  const dx = [], rx = [];
  if (!v.good) { dx.push('รวมสุทธิ ' + baht(v.net) + ' บาท ขาด/เกิน = ' + signed(v.gap) + ' บาท (ขาดจาก 280,000)'); rx.push('ตรวจยอดเงินฝากกับสมุดบัญชี และทะเบียนลูกหนี้ ให้ครบ 280,000'); }
  if (v.problem > 0) { dx.push('เงินมีปัญหา ' + baht(v.problem) + ' บาท' + (v.problemHH ? ' (' + v.problemHH + ' ครัวเรือน)' : '') + (v.problemCause ? ' สาเหตุ: ' + v.problemCause : '')); rx.push('ประชุมคณะกรรมการ ติดตามทวงถาม ทำหนังสือรับสภาพหนี้กับครัวเรือนที่ค้างชำระ'); if (v.problemAction) rx.push('ติดตามผลที่รายงานไว้: ' + v.problemAction); }
  if (v.damaged > 0) { dx.push('เงินเสียหาย ' + baht(v.damaged) + ' บาท' + (v.damagedCause ? ' สาเหตุ: ' + v.damagedCause : '')); rx.push('ตั้งคณะกรรมการตรวจสอบข้อเท็จจริง และรายงานอำเภอ'); }
  if (v.circ && v.deposit / v.circ >= 0.4) { dx.push('เงินค้างในบัญชี ' + Math.round(v.deposit / v.circ * 100) + '% ครัวเรือนยืมน้อย'); rx.push('ประชาสัมพันธ์ให้ครัวเรือนยากจนยื่นยืมเงินประกอบอาชีพตามระเบียบ'); }
  if (!dx.length) { dx.push('สุขภาพดี เงินครบตามมาตรฐาน 280,000'); rx.push('ติดตามตามรอบปกติ และยกเป็นหมู่บ้านตัวอย่าง'); }
  const startEdit = () => { setForm({ deposit: v.deposit, loaned: v.loaned, problem: v.problem, damaged: v.damaged }); setEdit(true); };
  const save = async () => {
    const patch = { deposit: num(form.deposit), loaned: num(form.loaned), problem: num(form.problem), damaged: num(form.damaged) };
    updateVillage(v.id, patch); setEdit(false); say('บันทึกในเครื่องแล้ว');
    if (mcpOk) { setPushing(true); setPushMsg('กำลังอัปเดต Google Sheets...'); const m = await pushOne(finish(Object.assign({}, v, patch))); setPushMsg(m); setPushing(false); }
  };
  const copy = (t, el) => { try { navigator.clipboard.writeText(t).then(() => say('คัดลอกแล้ว'), () => say('คัดลอกไม่ได้ กดค้างที่ตัวเลขเพื่อคัดลอก')); } catch (e) { say('คัดลอกไม่ได้ กดค้างที่ตัวเลขเพื่อคัดลอก'); } };
  const pct = (x) => Math.max(0, Math.min(100, x)) + '%';
  return html`
    <section class="card grid gap-3">
      <div class="flex items-center gap-3"><${Logo} size=${64} /><div class="min-w-0"><div class="text-xl font-semibold" style=${{ color: 'var(--navy-hi)' }}>${v.name}</div><div class="muted small">${v.address}</div></div></div>
      <div class="flex flex-wrap items-center gap-2"><${Status} v=${v} />${checked ? html`<span class="stamp">ตรวจแล้ว</span>` : null}</div>
      <div class="grid grid-cols-2 gap-2 small">
        <div><div class="muted">ประธาน</div><div>${v.chair || '—'}</div></div>
        <div><div class="muted">เบอร์โทร</div><div class="flex items-center gap-2"><span class="num" style=${{ userSelect: 'all' }}>${v.phone || '—'}</span>${v.phone ? html`<button class="chip" type="button" style=${{ padding: '1px 10px' }} onClick=${() => copy(v.phone)}>คัดลอก</button>` : null}</div></div>
        ${v.level ? html`<div><div class="muted">ระดับศักยภาพ</div><div>${v.level}</div></div>` : null}
        ${v.hh ? html`<div><div class="muted">ครัวเรือนที่ยืม</div><div class="num">${b0(v.hh)}</div></div>` : null}
      </div>
    </section>
    <section class="card grid gap-3">
      <div class="font-semibold">📟 จอสัญญาณชีพ</div>
      <div class="grid grid-cols-2 gap-2">
        <div class="money"><div class="k">เงินในบัญชี</div><div class="v">${baht(v.deposit)}</div></div>
        <div class="money"><div class="k">เงินลูกหนี้</div><div class="v">${baht(v.loaned)}</div></div>
        <div class="money risk"><div class="k">เงินเสี่ยง ติดตาม (มีปัญหา ${b0(v.problem)} + เสียหาย ${b0(v.damaged)}) · หักเฉพาะเสียหาย</div><div class="v">${baht(v.risk)}</div></div>
        <div class="money net"><div class="k">รวมสุทธิ</div><div class="v" style=${{ color: v.good ? 'var(--good)' : 'var(--bad)' }}>${baht(v.net)}</div></div>
      </div>
      <div class="small num muted">รวมสุทธิ = ${baht(v.deposit)} + ${baht(v.loaned)} − ${baht(v.damaged)} = <b style=${{ color: 'var(--fg)' }}>${baht(v.net)}</b> · ขาด/เกิน = ${baht(v.net)} − 280,000 = <b style=${{ color: v.gap < 0 ? 'var(--bad)' : 'var(--good)' }}>${signed(v.gap)}</b></div>
      <div><div class="row small"><span>รวมสุทธิ เทียบ 280K</span><span class="num">${Math.round(v.net / STD * 100)}%</span></div><div class="gauge"><i style=${{ width: pct(v.net / STD * 100), background: v.good ? 'var(--good)' : 'var(--bad)' }}></i></div></div>
      ${edit ? html`<div class="grid grid-cols-2 gap-2">
          ${[['deposit', 'เงินในบัญชี'], ['loaned', 'เงินลูกหนี้'], ['problem', 'เงินมีปัญหา'], ['damaged', 'เงินเสียหาย']].map(([k, l]) => html`<div class="field" key=${k}><label for=${'f-' + k}>${l}</label><input id=${'f-' + k} inputmode="decimal" value=${form[k]} onInput=${(e) => setForm(Object.assign({}, form, { [k]: e.target.value }))} /></div>`)}
          <div class="small muted" style=${{ gridColumn: '1 / -1' }}>รวมสุทธิใหม่ = <b class="num" style=${{ color: 'var(--fg)' }}>${baht(num(form.deposit) + num(form.loaned) - num(form.damaged))}</b> บาท</div>
          <button class="btn btn-ghost" type="button" onClick=${() => setEdit(false)}>ยกเลิก</button><button class="btn btn-gold" type="button" onClick=${save}>บันทึก${mcpOk ? ' + ส่งขึ้นชีต' : ''}</button>
        </div>` : html`<button class="btn btn-ghost" type="button" onClick=${startEdit}>✏️ แก้ตัวเลขของหมู่บ้านนี้</button>`}
      ${pushMsg ? html`<div class="small" style=${{ color: pushing ? 'var(--muted)' : 'var(--ok)' }}>${pushMsg}</div>` : null}
    </section>
    <section class="card grid gap-2"><div class="font-semibold">🩺 ผลวินิจฉัย</div><ul class="grid gap-1 pl-5 list-disc">${dx.map((d, i) => html`<li key=${i}>${d}</li>`)}</ul></section>
    <section class="card grid gap-2"><div class="font-semibold">💊 ใบสั่งการรักษา</div><ol class="grid gap-1 pl-5 list-decimal">${rx.map((d, i) => html`<li key=${i}>${d}</li>`)}</ol>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <button class="btn btn-gold" type="button" disabled=${checked} onClick=${() => checkVillage(v)}>${checked ? '✓ ตรวจแล้ว' : '✓ บันทึกการตรวจ'}</button>
        <button class="btn btn-navy" type="button" disabled=${!next} onClick=${() => { if (!checked) checkVillage(v); openVillage(next); }}>${next ? 'คนไข้ถัดไป ›' : 'ตรวจครบวอร์ด'}</button>
      </div>
      ${next ? html`<div class="muted small">ถัดไป: ${next.name} (${next.statusLabel})</div>` : null}
    </section>`;
}

/* ================= patients ================= */
function Patients(ctx) {
  const { villages, openVillage, game } = ctx;
  const [q, setQ] = useState(''); const [f, setF] = useState('all'); const [d, setD] = useState('');
  const districts = districtsOf(villages);
  const base = villages.filter((v) => !d || v.district === d);
  const list = base.filter((v) => (f === 'all' || (f === 'good' ? v.good : f === 'sick' ? !v.good : v.status === f)) && (!q || (v.name + ' ' + v.tambon + ' ' + v.chair + ' ' + v.district).includes(q.trim()))).sort((a, b) => a.net - b.net);
  const a = agg(base);
  return html`<section class="grid gap-3">
    <div class="text-xl font-semibold">🩺 คนไข้ทั้งหมด</div>

/* ================= report ================= */
function Report(ctx) {
  const { villages, exportExcel, exportCSV, say, award, openVillage, meta } = ctx;
  const districts = districtsOf(villages);
  const [d, setD] = useState(districts[0] || '');
  const list = villages.filter((v) => !d || v.district === d);
  const a = agg(list);
  const prov = list[0] ? list[0].province : '';
  const tambons = uniq(list.map((v) => v.tambon)).map((t) => ({ t, a: agg(list.filter((v) => v.tambon === t)) })).sort((x, y) => y.a.sick - x.a.sick || x.t.localeCompare(y.t, 'th'));
  const sick = list.filter((v) => !v.good).sort((x, y) => x.net - y.net);
  const today = thDate(new Date());
  const text = [
    'รายงานสรุปสถานะกองทุน กข.คจ. (เข็มทิศแก้หนี้ กข.คจ.)',
    'อ.' + d + ' จ.' + prov + ' · ข้อมูล ณ ' + today,
    '',
    '1. ภาพรวม: ' + a.n + ' หมู่บ้าน เงินครบ 280,000 บาท ' + a.good + ' หมู่บ้าน (ดีมาก ' + a.dm + ', ดี ' + a.d + ') ป่วย ' + a.sick + ' หมู่บ้าน (เริ่มป่วย ' + a.ss + ', ป่วยหนัก ' + a.sh + ')',

    '   เงินเสี่ยงที่ต้องติดตาม (มีปัญหา + เสียหาย) ' + baht(a.risk) + ' บาท',
    '3. หมู่บ้านที่ต้องเร่งแก้ไข:',
    ...(sick.length ? sick.map((v, i) => '   ' + (i + 1) + ') ' + v.name + ' หมู่ที่ ' + v.moo + ' ต.' + v.tambon + ' รวมสุทธิ ' + baht(v.net) + ' บาท ขาด/เกิน ' + signed(v.gap) + ' บาท' + (v.problemCause ? ' (' + v.problemCause + ')' : '')) : ['   ไม่มี']),
    '4. ข้อเสนอ: ติดตามทวงถามครัวเรือนที่ค้างชำระ ทำหนังสือรับสภาพหนี้ และรายงานผลทุกเดือน',
    '',
    'สูตร: รวมสุทธิ = เงินในบัญชี + เงินลูกหนี้ − เงินเสียหาย · ขาด/เกิน = รวมสุทธิ − 280,000',
    'จัดทำโดย หมอแก้หนี้ by Olifsuriya',
  ].join('\n');

    ${districts.length > 1 ? html`<div class="crumbs">${districts.map((x) => html`<button key=${x} class=${'chip' + (d === x ? ' on' : '')} type="button" onClick=${() => setD(x)}>อ.${x}</button>`)}</div>` : null}

      <div class="flex items-center gap-3"><${Logo} size=${56} /><div><div class="font-bold" style=${{ color: 'var(--navy)', fontSize: '1.1rem' }}>รายงานสรุปกองทุน กข.คจ.</div><div class="small">อ.${d} จ.${prov} · ข้อมูล ณ ${today}</div><div class="small" style=${{ opacity: .7 }}>แหล่งข้อมูล: ${meta.source}</div></div></div>
      <div class="grid grid-cols-3 gap-2 text-center">

      </div>
      <p class="small">เงินในบัญชี <b class="num">${baht(a.deposit)}</b> + เงินลูกหนี้ <b class="num">${baht(a.loaned)}</b> − เงินเสียหาย <b class="num" style=${{ color: '#b4332f' }}>${baht(a.damaged)}</b> = รวมสุทธิ <b class="num">${baht(a.net)}</b> บาท · เงินเสี่ยงที่ต้องติดตาม (มีปัญหา + เสียหาย) <b class="num">${baht(a.risk)}</b></p>
      <div class="scroll-x"><table class="rep" style=${{ color: '#1b2a40' }}>
        <thead><tr><th style=${{ color: '#5b6b80' }}>ตำบล</th><th class="r" style=${{ color: '#5b6b80' }}>หมู่</th><th class="r" style=${{ color: '#5b6b80' }}>ครบ</th><th class="r" style=${{ color: '#5b6b80' }}>ป่วย</th><th class="r" style=${{ color: '#5b6b80' }}>เสี่ยง</th><th class="r" style=${{ color: '#5b6b80' }}>สุทธิ</th></tr></thead>
        <tbody>${tambons.map(({ t, a }) => html`<tr key=${t}><td>${t}</td><td class="r">${a.n}</td><td class="r">${a.good}</td><td class="r" style=${{ color: a.sick ? '#b4332f' : 'inherit', fontWeight: a.sick ? 600 : 400 }}>${a.sick}</td><td class="r">${b0(a.risk)}</td><td class="r">${b0(a.net)}</td></tr>`)}</tbody>
      </table></div>
      <div class="font-semibold" style=${{ color: 'var(--navy)' }}>หมู่บ้านที่ต้องเร่งแก้ไข (${sick.length})</div>
      ${sick.length ? html`<ol class="grid gap-1 pl-5 list-decimal small">${sick.map((v) => html`<li key=${v.id}><button type="button" style=${{ background: 'none', border: 0, padding: 0, textAlign: 'left', color: 'inherit', textDecoration: 'underline' }} onClick=${() => openVillage(v)}>${v.name} หมู่ที่ ${v.moo} ต.${v.tambon}</button> · สุทธิ <b class="num">${baht(v.net)}</b> ขาด/เกิน <b class="num" style=${{ color: '#b4332f' }}>${signed(v.gap)}</b>${v.problemCause ? ' · ' + v.problemCause : ''}</li>`)}</ol>` : html`<p class="small">ไม่มีหมู่บ้านป่วย</p>`}
      <p class="small" style=${{ opacity: .75 }}>สูตร: รวมสุทธิ = เงินในบัญชี + เงินลูกหนี้ − เงินเสียหาย · ขาด/เกิน = รวมสุทธิ − 280,000</p>
    </article>
    <div class="grid grid-cols-3 gap-2">
      <button class="btn btn-gold" type="button" onClick=${copy}>📋 คัดลอก</button>
      <button class="btn btn-navy" type="button" onClick=${() => exportExcel(list)}>📊 Excel</button>

    <details class="card"><summary class="cursor-pointer muted">ข้อความรายงาน (สำหรับวางใน LINE หรือหนังสือ)</summary><pre class="small mt-2" style=${{ whiteSpace: 'pre-wrap', fontFamily: 'inherit', userSelect: 'all' }}>${text}</pre></details>
  </section>`;
}

/* ================= me (game) ================= */

  const tambons = uniq(villages.map((v) => v.district + '|' + v.tambon));
  const fullWards = tambons.filter((k) => villages.filter((v) => v.district + '|' + v.tambon === k).every((v) => game.checked[v.id])).length;
  const badges = [
    ['🩺', 'ตรวจคนไข้รายแรก', checked >= 1], ['🏥', 'ตรวจครบ 1 วอร์ด', fullWards >= 1], ['🚑', 'ดูแลเคสป่วยครบ', sickAll.length > 0 && sickDone === sickAll.length],
    ['🧭', 'ตรวจครบทุกหมู่บ้าน', checked === villages.length && villages.length > 0], ['🌸', 'พัฒนาการอำเภอ', lv >= 2], ['👑', 'พัฒนาการจังหวัด', lv >= 3],
  ];
  return html`<section class="grid gap-3">
    <section class="hero grid gap-3 justify-items-center text-center">
      <${Logo} size=${120} src=${mascotOf(game.xp)} /><span class="chip on" style=${{ fontWeight: 600 }}>Lv${lv}</span>
      <div class="text-2xl font-bold">${rankOf(game.xp)}</div>
      <div class="w-full max-w-xs"><div class="xpbar" style=${{ height: 10 }}><i style=${{ width: (into / 4) + '%' }}></i></div><div class="small mt-1 num">${into}/400 XP · รวม ${b0(game.xp)} XP · ${b0(game.coins)} <i class="coin"></i></div></div>
    </section>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${checked}</div><div class="small muted">ตรวจแล้ว/${villages.length}</div></div>
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${sickDone}</div><div class="small muted">เคสป่วย/${sickAll.length}</div></div>
      <div class="card" style=${{ padding: 12 }}><div class="text-2xl font-semibold num">${fullWards}</div><div class="small muted">วอร์ดครบ/${tambons.length}</div></div>
    </div>
    <section class="card grid gap-3"><div class="font-semibold">🧭 เส้นทางตำแหน่ง</div>
      <div class="grid grid-cols-3 gap-2 text-center">${RANKS.map((r, i) => { const on = rankIdx(game.xp) >= i, cur = rankIdx(game.xp) === i;
        return html`<div key=${r.name} class="grid justify-items-center gap-1" style=${{ border: '1.5px solid ' + (cur ? 'var(--gold)' : 'var(--line)'), borderRadius: 16, padding: '10px 6px', opacity: on ? 1 : .45, filter: on ? 'none' : 'grayscale(1)' }}>
          <${Logo} size=${64} src=${r.img} /><div class="small font-semibold">Lv${i + 1} ${r.name}</div>
          <div style=${{ fontSize: '.72rem', color: cur ? 'var(--gold)' : 'var(--muted)' }}>${cur ? 'ตำแหน่งปัจจุบัน' : on ? 'ผ่านแล้ว' : 'ปลดล็อกที่ ' + r.xp + ' XP'}</div></div>`; })}</div>
    </section>
    <section class="card grid gap-2"><div class="font-semibold">🏅 เหรียญตรา</div><div class="grid grid-cols-3 gap-2">${badges.map(([i, l, ok]) => html`<div key=${l} class="text-center" style=${{ opacity: ok ? 1 : .35, border: '1.5px solid var(--line)', borderRadius: 14, padding: 8 }}><div class="text-2xl">${i}</div><div class="small">${l}</div></div>`)}</div></section>
    <section class="card grid gap-1 small muted"><div class="font-semibold" style=${{ color: 'var(--fg)' }}>วิธีเก็บ XP</div><p>ตรวจหมู่บ้านที่เงินครบ +20 XP · ดูแลเคสป่วย +40 XP · เปิดวอร์ดใหม่ +5 · นำเข้าไฟล์ +50 · ซิงค์ชีต +30 · ส่งออก +15 · 400 XP เลื่อนเป็นพัฒนาการอำเภอ · 800 XP เลื่อนเป็นพัฒนาการจังหวัด</p><p>คะแนนเก็บในเครื่องนี้เท่านั้น</p></section>
    <button class="btn btn-danger" type="button" onClick=${() => setModal({ type: 'confirmReset', title: 'เริ่มเกมใหม่?', body: 'XP เหรียญ และสถานะตรวจแล้วทั้งหมดในเครื่องนี้จะถูกล้าง', run: () => setGame({ xp: 0, coins: 0, checked: {}, wards: {}, badges: {} }) })}>เริ่มเกมใหม่</button>
  </section>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
