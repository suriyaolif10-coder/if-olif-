<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
.f{background:radial-gradient(900px 1100px at 50% 46%,#5d6a1c 0%,#353615 45%,#141408 100%)}
.beam{position:absolute;left:-200px;top:-300px;width:900px;height:2600px;transform:rotate(-24deg);background:linear-gradient(90deg,transparent,#ebbe1d22 40%,#f8f5e338 50%,#ebbe1d22 60%,transparent);filter:blur(30px)}
.floor{position:absolute;left:0;right:0;top:1390px;bottom:0;background:linear-gradient(180deg,#1d1e0b 0%,#0f0f06 100%)}
.disc{position:absolute;left:190px;width:700px;top:1340px;height:120px;border-radius:50%;background:radial-gradient(closest-side,#c4a165 0%,#8a6d3f 70%,#4a3a1e 100%);box-shadow:0 30px 60px #000a}
.bottle{position:absolute;left:50%;top:330px;height:1080px;transform:translateX(-50%) rotate(-3deg);filter:drop-shadow(0 40px 50px #000c) drop-shadow(-14px 0 30px #ebbe1d33)}
.refl{position:absolute;left:50%;top:1402px;height:1080px;transform:translateX(-50%) scaleY(-1) rotate(3deg);opacity:.16;filter:blur(3px);-webkit-mask-image:linear-gradient(0deg,#000 0%,transparent 30%)}
.leaf{position:absolute;filter:blur(14px) brightness(.9);opacity:.95}
.l1{left:-160px;top:1450px;width:760px;transform:rotate(-20deg)}
.l2{right:-210px;top:120px;width:620px;transform:rotate(150deg);filter:blur(22px) brightness(.7)}
.drop{position:absolute;left:395px;top:470px;width:34px;height:46px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff8 0 12%,#ebbe1d 40%,#a37e0a 100%);box-shadow:0 0 30px #ebbe1daa}
.t{position:absolute;left:0;right:0;top:120px;text-align:center;font:700 150px/1 Taviraj;color:var(--cream);letter-spacing:4px;text-shadow:0 10px 40px #0008}
.t small{display:block;font:500 40px Kanit;letter-spacing:14px;color:var(--gold);margin-top:22px}
.foot{position:absolute;left:0;right:0;bottom:120px;text-align:center;font:300 46px Kanit;color:var(--label)}
</style></head><body><div class="f" data-width="1080" data-height="1920">
<div class="beam"></div><div class="floor"></div><div class="disc"></div>
<img class="leaf l2" src="../assets/leaves-left.png">
<img class="refl" src="../assets/bottle.png"><img class="bottle" src="../assets/bottle.png">
<div class="drop"></div>
<img class="leaf l1" src="../assets/leaves-left.png">
<div class="t">ภูไพร<small>PHU PRAI MASSAGE OIL</small></div>
<div class="foot">น้ำมันนวดคลายเส้น · ยาแผนไทย</div>
</div></body></html>
