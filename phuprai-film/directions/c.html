<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
.f{background:var(--cream)}
.knot{position:absolute;left:0;right:0;top:170px;text-align:center;font:900 250px/0.9 Kanit;color:var(--ink);letter-spacing:-38px;transform:scaleX(.62) skewX(-8deg) rotate(-4deg)}
.knot span{display:inline-block}
.knot .a{transform:rotate(-14deg) translateY(10px)}.knot .b{transform:rotate(9deg) translateY(-20px)}.knot .c{transform:rotate(-6deg) translateY(16px)}.knot .d{transform:rotate(12deg)}
.tag1{position:absolute;left:90px;top:120px;font:500 36px Kanit;color:#b3261e;letter-spacing:2px}
.stroke{position:absolute;left:-100px;top:640px;width:1400px;height:260px;transform:rotate(-9deg);background:linear-gradient(90deg,transparent,#ebbe1d 18%,#f2cf4a 60%,#ebbe1d00);border-radius:200px;filter:blur(2px);opacity:.95}
.loose{position:absolute;left:0;right:0;top:960px;text-align:center;font:300 210px/1 Kanit;color:var(--olive);letter-spacing:34px}
.tag2{position:absolute;left:0;right:0;top:1210px;text-align:center;font:500 44px Kanit;color:var(--navy);letter-spacing:3px}
.bar{position:absolute;left:90px;right:90px;bottom:120px;display:flex;align-items:center;gap:34px;padding:26px 34px;background:var(--olive);border-radius:26px;color:var(--cream)}
.bar img{height:300px;margin:-90px 0 -20px}
.bar b{display:block;font:700 76px/1 Taviraj;color:var(--gold)}
.bar span{font:500 34px Kanit}
</style></head><body><div class="f" data-width="1080" data-height="1920">
<div class="tag1">ตึง · ล้า · ปวดเมื่อย</div>
<div class="knot"><span class="a">ป</span><span class="b">ว</span><span class="c">ด</span><span class="d">ตึ</span><span class="a">ง</span></div>
<div class="stroke"></div>
<div class="loose">คลาย</div>
<div class="tag2">ทา · ถู · นวด บริเวณที่ปวดเมื่อย</div>
<div class="bar"><img src="../assets/bottle.png"><div><b>ภูไพร</b><span>น้ำมันนวดคลายเส้น · ยาแผนไทย</span></div></div>
</div></body></html>
